<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="300" height="300">
  <!-- The mark in its original colours, the same drawing the CLI banner
       prints: an outlined square with a stroke of 2 half-units and a filled
       square offset onto it, the ring a step lighter than the square so the
       overlap reads. The white is not a background: it is a keyline, one
       half-unit wide, half the ring's stroke, following the outer
       silhouette of the two squares, plus the ring's counter, so the shapes
       carry their own edge onto any surface and everything beyond the
       keyline stays transparent. All coordinates are integers on the
       half-unit grid, so any multiple of 20 pixels renders without
       anti-aliasing. -->
  <rect x="0" y="0" width="14" height="14" fill="#FFFFFF"/>
  <rect x="6" y="6" width="14" height="14" fill="#FFFFFF"/>
  <path fill="#171717" fill-rule="evenodd" d="M1 1h12v12H1Z M3 3v8h8V3Z"/>
  <rect x="7" y="7" width="12" height="12" fill="#0D0D0D"/>
</svg>
