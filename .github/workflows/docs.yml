name: docs

# Build gate only. The site is deployed exclusively by the release run, from
# the docs package's publish stage (scripts/deploy-docs.sh), so nothing here
# touches gh-pages.
#
# The build is the link checker: docusaurus.config.ts sets onBrokenLinks,
# onBrokenAnchors and onBrokenMarkdownLinks to 'throw', so a dead relative
# link or a stale #anchor fails this job instead of shipping.
on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'imgs/**'
      # The workspace root: a dependency bump or a pnpm setting change belongs
      # to this build as much as an edited page does.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'packages/docs/**'
      - 'imgs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # showLastUpdateTime reads git history

      # Before setup-node: its pnpm cache needs pnpm on PATH, and the version
      # comes from packageManager in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packages/docs/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The workspace root owns the lockfile, so the install runs there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter dispat-docs build
