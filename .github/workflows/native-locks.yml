name: Native lock semantics

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locks:
    name: Locks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Byte-range locks and filesystem aliases must run on their native
      # kernel. A Linux container or a cross-compiled binary cannot test them.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - name: Worker ownership, restart, and output staging
        run: go test ./services/dispat/internal/execution -count=1 -timeout=5m -run 'TestNodeState|TestOutputStagingSeparatesCollidingPackageNames|TestTaskFolderIsAName'
      - name: Git transport and mutation exclusion
        run: go test ./services/dispat/internal/gitx -count=1 -timeout=5m
      - name: Executable replacement and rollback
        run: go test ./services/dispat/internal/selfupdate -count=1 -timeout=5m -run 'TestReplacePreservesPreviousBackupWhenIncomingRenameFails|TestReplaceOverwritesAnOlderBackup|TestRestoreRotatesWithoutRunningAnything'
