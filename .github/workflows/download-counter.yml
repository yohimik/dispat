name: Refresh download counter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-counter.yml'
      - 'packages/docs/download-counter/**'
  schedule:
    # Every 15 minutes, away from GitHub's busy start-of-hour queue.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: download-counter
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test and collect a complete snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/workspace" \
            -w /workspace/packages/docs/download-counter golang:1.26-bookworm \
            sh -euc 'sh test.sh && GOWORK=off go run . -output /workspace/downloads.json'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASER_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Publish the snapshot
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_URL_MAP: ${{ vars.DOCS_URL_MAP }}
        run: |
          set -eu
          : "${DOCS_BUCKET:?DOCS_BUCKET is required (see infra/README.md)}"
          : "${DOCS_URL_MAP:?DOCS_URL_MAP is required (see infra/README.md)}"
          gcloud storage cp --cache-control="public, max-age=300, must-revalidate" \
            downloads.json "gs://${DOCS_BUCKET}/downloads.json"
          # Uploading the object does not evict a cached response, including
          # a 404 from before the first snapshot. Wait for exact-path eviction.
          gcloud compute url-maps invalidate-cdn-cache "${DOCS_URL_MAP}" \
            --path="/downloads.json" --quiet
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 10 --max-time 20 \
            https://dispat.dev/downloads.json --output served-downloads.json
          cmp downloads.json served-downloads.json
