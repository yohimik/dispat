name: Build experiments

# These manually selected campaigns only build and retain experiment evidence.
# Production release gates and publication live in release.yml.
on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Isolated two-node build experiment
        required: true
        default: llvm-gce
        type: choice
        options: [llvm-gce, kernel-gce]
      llvm-profile:
        description: Full selected workload build or explicitly partial smoke validation
        required: true
        default: full
        type: choice
        options: [full, smoke]
      cloud-zone:
        description: One fixed zone for every cell in this build campaign
        required: true
        default: us-central1-b
        type: string
      cloud-cpu-platform:
        description: Exact CPU platform (Sapphire Rapids requires C3; Cascade/Ice Lake require N2)
        required: true
        default: Intel Cascade Lake
        type: choice
        options: [Intel Cascade Lake, Intel Ice Lake, Intel Sapphire Rapids]
      cloud-machine-type:
        description: One fixed four-CPU, sixteen-GiB machine type for every cell
        required: true
        default: n2-standard-4
        type: choice
        options: [n2-standard-4, c3-standard-4]

permissions:
  contents: read

env:
  # Missing credentials must fail unattended jobs instead of opening a prompt.
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: ""
  # Our own modules are fetched directly from the repository, skipping the
  # proxy and the sum database: both lag fresh tags, and both are immutable,
  # so a tag ever recreated at different content (a rolled-back run) leaves
  # the proxy's first copy pinned for good and every checksum check failing.
  GOPRIVATE: github.com/yohimik/dispat

concurrency:
  group: release-${{ inputs.purpose }}
  cancel-in-progress: false

jobs:
  llvm-prepare:
    name: Prepare one immutable ${{ inputs.purpose == 'kernel-gce' && 'Linux kernel' || 'LLVM' }} experiment image
    if: inputs.purpose == 'llvm-gce' || inputs.purpose == 'kernel-gce'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_WORKLOAD: ${{ inputs.purpose == 'kernel-gce' && 'linux-kernel' || 'llvm' }}
      BUILD_DOCKERFILE: ${{ inputs.purpose == 'kernel-gce' && 'tests/experiments/Dockerfile.kernel' || 'tests/experiments/Dockerfile.llvm' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use the same classic image store as the experiment workers
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "storage-driver": "overlay2",
              "features": {"containerd-snapshotter": false}
            }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 582.0.0
      - name: Pin one boot image and CPU platform for the campaign
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          CLOUD_ZONE: ${{ inputs.cloud-zone }}
          CLOUD_CPU_PLATFORM: ${{ inputs.cloud-cpu-platform }}
          CLOUD_MACHINE_TYPE: ${{ inputs.cloud-machine-type }}
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-bundle"
          case "$CLOUD_MACHINE_TYPE:$CLOUD_CPU_PLATFORM" in
            'n2-standard-4:Intel Cascade Lake'|'n2-standard-4:Intel Ice Lake') ;;
            'c3-standard-4:Intel Sapphire Rapids') ;;
            *) echo "Machine type and CPU platform must be a supported fixed pair." >&2; exit 1 ;;
          esac
          gcloud compute zones describe "$CLOUD_ZONE" --project "$GCP_PROJECT" --format=json \
            > "$RUNNER_TEMP/llvm-bundle/zone.json"
          jq -e --arg platform "$CLOUD_CPU_PLATFORM" '.availableCpuPlatforms | index($platform) != null' "$RUNNER_TEMP/llvm-bundle/zone.json"
          gcloud compute regions describe "$(jq -r '.region | split("/") | last' "$RUNNER_TEMP/llvm-bundle/zone.json")" \
            --project "$GCP_PROJECT" --format=json > "$RUNNER_TEMP/llvm-bundle/region.json"
          if [ "$CLOUD_MACHINE_TYPE" = c3-standard-4 ]; then
            jq '.quotas[] | select(.metric == "C3_CPUS") | {metric, limit, usage}' "$RUNNER_TEMP/llvm-bundle/region.json"
            jq -e 'any(.quotas[]; .metric == "C3_CPUS" and (.limit - .usage) >= 8)' "$RUNNER_TEMP/llvm-bundle/region.json" \
              || { echo "A two-worker C3 cell requires eight available regional C3 CPUs." >&2; exit 1; }
          fi
          gcloud compute images describe-from-family ubuntu-2404-lts-amd64 --project ubuntu-os-cloud \
            --format=json > "$RUNNER_TEMP/llvm-bundle/boot-image.json"
          jq -n --arg bootImage "$(jq -r .selfLink "$RUNNER_TEMP/llvm-bundle/boot-image.json")" \
            --arg zone "$CLOUD_ZONE" --arg platform "$CLOUD_CPU_PLATFORM" --arg machine "$CLOUD_MACHINE_TYPE" \
            '{bootImage:$bootImage,cpuPlatform:$platform,zone:$zone,machineType:$machine}' \
            > "$RUNNER_TEMP/llvm-bundle/cloud-profile.json"
      - name: Retain hardware selection and quota evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.purpose }}-hardware-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/llvm-bundle/zone.json
            ${{ runner.temp }}/llvm-bundle/region.json
            ${{ runner.temp }}/llvm-bundle/boot-image.json
            ${{ runner.temp }}/llvm-bundle/cloud-profile.json
          retention-days: 30
          if-no-files-found: warn
      - name: Build exact checkout binaries and prepared image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-bundle"
          docker info --format '{"ServerVersion":{{json .ServerVersion}},"Driver":{{json .Driver}},"DriverStatus":{{json .DriverStatus}},"Architecture":{{json .Architecture}},"OSType":{{json .OSType}},"CgroupDriver":{{json .CgroupDriver}},"CgroupVersion":{{json .CgroupVersion}}}' \
            > "$RUNNER_TEMP/llvm-bundle/prepare-docker-info.json"
          jq -e '.Driver == "overlay2" and (.ServerVersion | length > 0) and (all(.DriverStatus[]?; . != ["driver-type", "io.containerd.snapshotter.v1"]))' \
            "$RUNNER_TEMP/llvm-bundle/prepare-docker-info.json"
          experiment_builder="$(docker context show)"
          docker buildx inspect "$experiment_builder" | awk '$1 == "Driver:" && $2 == "docker" && NF == 2 { found=1 } END { exit found ? 0 : 1 }'
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/llvm-bundle:/out" -w /src \
            -e CGO_ENABLED=0 golang:1.26.10 \
            go build -trimpath -buildvcs=false -ldflags "-s -w -X github.com/yohimik/dispat/services/dispat/internal/cli.Version=1.11.0-rc.13-candidate.$SOURCE_SHA" -o /out/dispat ./services/dispat
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/llvm-bundle:/out" -w /src \
            -e CGO_ENABLED=0 golang:1.26.10 go build -trimpath -buildvcs=false -o /out/llvmcloud ./tools/llvmcloud
          docker buildx build --builder "$experiment_builder" --load -f tests/experiments/Dockerfile \
            --build-context "candidate-binary=$RUNNER_TEMP/llvm-bundle" \
            --build-context measurement-source=./tools \
            --build-arg DISPAT_BINARY_SOURCE=candidate-binary \
            --build-arg "DISPAT_BINARY_ID=1.11.0-rc.13-candidate.$SOURCE_SHA" \
            -t dispat-experiments:llvm-gce tests/experiments
          docker buildx build --builder "$experiment_builder" --load -f "$BUILD_DOCKERFILE" \
            --build-arg GO_VERSION=1.26.10 --build-arg EXPERIMENTS_IMAGE=dispat-experiments:llvm-gce \
            -t dispat-build:gce .
          docker image inspect dispat-build:gce > "$RUNNER_TEMP/llvm-bundle/image.json"
          docker save dispat-build:gce | gzip -1 > "$RUNNER_TEMP/llvm-bundle/image.tar.gz"
          (cd "$RUNNER_TEMP/llvm-bundle" && sha256sum dispat llvmcloud image.tar.gz cloud-profile.json boot-image.json zone.json region.json prepare-docker-info.json > checksums.txt)
          jq -n --arg source "$SOURCE_SHA" --arg image "$(docker image inspect --format '{{.Id}}' dispat-build:gce)" \
            --arg binary "$(sha256sum "$RUNNER_TEMP/llvm-bundle/dispat" | cut -d ' ' -f1)" \
            '{source:$source,image:$image,binarySha256:$binary,goVersion:"1.26.10",platform:"linux/amd64"}' \
            > "$RUNNER_TEMP/llvm-bundle/provenance.json"
      - name: Record unsupported Changesets cell from the same image
        env:
          SOURCE_SHA: ${{ github.sha }}
          LLVM_PROFILE: ${{ inputs.llvm-profile }}
          TRIAL_ID: ${{ github.run_id }}-${{ github.run_attempt }}-changesets-distributed
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-unsupported"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/llvm-unsupported,dst=/results" \
            --env "EXPERIMENTS_DISPAT_SOURCE_REVISION=$SOURCE_SHA" \
            "$(jq -r .image "$RUNNER_TEMP/llvm-bundle/provenance.json")" \
            --workload "$BUILD_WORKLOAD" --tool changesets --mode distributed --profile "$LLVM_PROFILE" --trial-id "$TRIAL_ID" --repetition 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.purpose }}-changesets-distributed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-unsupported
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.purpose }}-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-bundle
          retention-days: 7
          compression-level: 0

  llvm-gce:
    name: ${{ inputs.purpose }} · ${{ matrix.tool }} ${{ matrix.mode }}
    if: inputs.purpose == 'llvm-gce' || inputs.purpose == 'kernel-gce'
    needs: llvm-prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.purpose == 'kernel-gce' && 360 || 300 }}
    env:
      BUILD_WORKLOAD: ${{ inputs.purpose == 'kernel-gce' && 'linux-kernel' || 'llvm' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {tool: dispat, mode: compilation}
          - {tool: dispat, mode: interpretation}
          - {tool: dispat, mode: hybrid}
          - {tool: nx, mode: manual-gcp-split}
          - {tool: lerna, mode: manual-gcp-split}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use the same classic image store as preparation and workers
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "storage-driver": "overlay2",
              "features": {"containerd-snapshotter": false}
            }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.purpose }}-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-bundle
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 582.0.0
      - name: Run one cell with fresh outputs on two matching GCE workers
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          LLVM_MODE: ${{ matrix.mode }}
          LLVM_TOOL: ${{ matrix.tool }}
          LLVM_PROFILE: ${{ inputs.llvm-profile }}
          TRIAL_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tool }}-${{ matrix.mode }}
        run: |
          chmod +x "$RUNNER_TEMP/llvm-bundle/llvmcloud"
          (cd "$RUNNER_TEMP/llvm-bundle" && sha256sum --check checksums.txt)
          test "$(jq -r .source "$RUNNER_TEMP/llvm-bundle/provenance.json")" = "$GITHUB_SHA"
          docker load -i "$RUNNER_TEMP/llvm-bundle/image.tar.gz"
          sudo install -m 0755 "$RUNNER_TEMP/llvm-bundle/llvmcloud" /usr/local/bin/llvmcloud
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /cloud
          /usr/local/bin/llvmcloud run \
            --workload "$BUILD_WORKLOAD" --project "$GCP_PROJECT" --id "$TRIAL_ID" --tool "$LLVM_TOOL" --mode "$LLVM_MODE" --profile "$LLVM_PROFILE" \
            --zone "$(jq -r .zone "$RUNNER_TEMP/llvm-bundle/cloud-profile.json")" \
            --machine-type "$(jq -r .machineType "$RUNNER_TEMP/llvm-bundle/cloud-profile.json")" \
            --boot-image "$(jq -r .bootImage "$RUNNER_TEMP/llvm-bundle/cloud-profile.json")" \
            --cpu-platform "$(jq -r .cpuPlatform "$RUNNER_TEMP/llvm-bundle/cloud-profile.json")" \
            --archive "$RUNNER_TEMP/llvm-bundle/image.tar.gz" \
            --image "$(jq -r .image "$RUNNER_TEMP/llvm-bundle/provenance.json")" \
            --source "$(jq -r .source "$RUNNER_TEMP/llvm-bundle/provenance.json")" \
            --binary-sha256 "$(jq -r .binarySha256 "$RUNNER_TEMP/llvm-bundle/provenance.json")"
      - name: Verify cleanup of exactly this cell's instances
        if: always()
        run: |
          if sudo test -f /cloud/state.json; then
            /usr/local/bin/llvmcloud cleanup /cloud
          fi
      - name: Make nonsecret evidence readable
        if: always()
        run: |
          if sudo test -d /cloud/results; then
            sudo cp -a /cloud/results "$RUNNER_TEMP/llvm-results"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/llvm-results"
            if test -f "$RUNNER_TEMP/llvm-bundle/prepare-docker-info.json"; then
              mkdir -p "$RUNNER_TEMP/llvm-results/cloud"
              cp "$RUNNER_TEMP/llvm-bundle/prepare-docker-info.json" "$RUNNER_TEMP/llvm-results/cloud/"
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ inputs.purpose }}-${{ matrix.tool }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-results
          retention-days: 30
          if-no-files-found: error

  llvm-report:
    name: Validate and collect all six build campaign records
    if: ${{ always() && (inputs.purpose == 'llvm-gce' || inputs.purpose == 'kernel-gce') && needs.llvm-prepare.result == 'success' }}
    needs: [llvm-prepare, llvm-gce]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_WORKLOAD: ${{ inputs.purpose == 'kernel-gce' && 'linux-kernel' || 'llvm' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build report tools with the campaign Go version
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-report-tools"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/llvm-report-tools:/out" -w /src/tools \
            -e GOWORK=off golang:1.26.10 go build -trimpath -buildvcs=false -o /out/ ./llvmexperiment ./testreport
      # Exact artifact names exclude the large prepared OCI archive and retain
      # each failed cell independently; missing artifacts fail collection below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ inputs.purpose }}-dispat-compilation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-incoming/dispat-compilation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ inputs.purpose }}-dispat-interpretation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-incoming/dispat-interpretation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ inputs.purpose }}-dispat-hybrid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-incoming/dispat-hybrid
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ inputs.purpose }}-nx-manual-gcp-split-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-incoming/nx-manual-gcp-split
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ inputs.purpose }}-lerna-manual-gcp-split-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-incoming/lerna-manual-gcp-split
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ inputs.purpose }}-changesets-distributed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-incoming/changesets-distributed
      - name: Check source, binary, workload, topology and retained formulas
        env:
          LLVM_PROFILE: ${{ inputs.llvm-profile }}
        run: |
          "$RUNNER_TEMP/llvm-report-tools/llvmexperiment" collect --input "$RUNNER_TEMP/llvm-incoming" \
            --output "$RUNNER_TEMP/llvm-report" --source "$GITHUB_SHA" --profile "$LLVM_PROFILE" --workload "$BUILD_WORKLOAD"
      - name: Render available observations and missing-cell diagnostics
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/llvm-report/campaign.json"; then
            jq -r '.cells[] | "- \(.tool) / \(.mode): \(.status)\(if .reason then " — " + .reason else "" end)"' \
              "$RUNNER_TEMP/llvm-report/campaign.json" >> "$GITHUB_STEP_SUMMARY"
            "$RUNNER_TEMP/llvm-report-tools/testreport" experiments -markdown "$RUNNER_TEMP/llvm-report/cells" \
              > "$RUNNER_TEMP/llvm-report/experiments.md"
            cat "$RUNNER_TEMP/llvm-report/experiments.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ inputs.purpose }}-report-${{ inputs.llvm-profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llvm-report
          retention-days: 30
          if-no-files-found: error
