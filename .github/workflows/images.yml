name: Images

# The four image packages, built exactly as a release builds them but pushing
# nothing. It doubles as a live test of install.sh: every image installs the
# currently released CLI through it, on both architectures.
on:
  pull_request:
    paths:
      - docker/**
      - install.sh
      - scripts/float-tags.sh
      - dispat.json
      - .github/workflows/images.yml

permissions:
  contents: read

jobs:
  build:
    name: Build every image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # dispat reads tags to work out the plan

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # arm64 layers are emulated here. The alternative is a second job on a
      # native arm64 runner and a digest merge, which is a lot of moving parts
      # for a gate that only has to answer "does this still build".
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build dispat from the checkout
        run: go build -C services/dispat -o "$PWD/dispat" .

      # `dispat run` hands each package the exact stage environment its release
      # would, which is what the compose files interpolate: this is the release
      # command, minus the push.
      - name: Build the images
        run: ./dispat run build-image --since all -s docker
