name: Release

# dispat releases itself: this workflow builds the CLI from the checkout and
# runs it against the repository. dispat computes the plan from the
# conventional commits, rewrites the go.mods (autoVersion), writes the
# changelogs, creates one release commit carrying all of it, tags every
# released module on that commit (pkg/<name>/v<version>,
# services/dispat/v<version>) and pushes the branch and the tags.
#
# Triggered manually: the tags do not exist before dispat creates them, and
# tags pushed with the workflow's own GITHUB_TOKEN would not re-trigger a
# tag-push workflow anyway, so the binary build and the GitHub release run
# right here, after the dispat run, keyed off the tag it created.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: dispat

jobs:
  release:
    name: Run dispat, publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history: dispat reads tags and commit ranges

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Configure the release committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build dispat from the checkout
        run: go build -C services/dispat -o "$PWD/dispat" .

      - name: Run the release
        # dispat does the whole release itself: autoVersion rewrites, the
        # release commit, tags, the push, and the GitHub release with the
        # three cross-compiled binaries its build stage exported.
        # GITHUB_REPOSITORY is set by Actions; the token is not, so pass it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The syncLock `go mod tidy` and the module-mode binary builds must
          # resolve the dependency tags this same run just pushed: fetch our
          # own modules directly from the repository, skipping the proxy and
          # the sum database, both of which lag fresh tags.
          GOPRIVATE: github.com/yohimik/dispat
        run: ./dispat --log-format json
