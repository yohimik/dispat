name: Release

# dispat releases itself: the release job builds a fresh CLI from the checkout
# and runs it against the repository. dispat computes the plan from the
# conventional commits, rewrites the go.mods (autoVersion), writes the
# changelogs, creates one release commit carrying all of it, tags every
# released module on that commit (pkg/<name>/v<version>,
# services/dispat/v<version>) and pushes the branch and the tags.
#
# Triggered manually: the tags do not exist before dispat creates them, and
# tags pushed with the workflow's own GITHUB_TOKEN would not re-trigger a
# tag-push workflow anyway, so the binary build and the GitHub release run
# right here, after the dispat run, keyed off the tag it created.
#
# Every stage runs inside Docker — the gates as buildx builds, the deploys as
# `docker run` against the release tools image — so the jobs install no Go,
# Node or Terraform; what remains here is checkouts, Docker plumbing,
# credentials and artifact transport.
#
# Five jobs, in order: is there anything to release, do the announcement's
# credentials still work, does the whole suite pass, release it, and then check
# that what was released installs. Each is a gate on the next, so nothing is
# published by a run whose tests never ran.
#
# The release experiments are not a job here. They run inside the release, as
# the docs package's beforeBuild hook, against the image the same run just
# published, so the figures the site ships are that run's own rather than a
# courier's. What remains here is keeping their records as an artifact.
on:
  workflow_dispatch:

# Read by default; the two jobs that push (the badge branch, the release
# itself) widen to write on their own. The gate and the install check hold
# no more than they use.
permissions:
  contents: read

# The composite action installs the previous published release as a
# bootstrap only; right after it, every job builds dispat from the checkout
# and puts that build first on PATH. Everything that follows — the status
# gate, the suite, the release and its record-writing stage scripts — runs
# the checkout's own dispat, so the driver can never lag the configuration
# or the records it writes. With 1.0.0 out, the
# bootstrap resolves the latest stable release itself.
env:
  # Our own modules are fetched directly from the repository, skipping the
  # proxy and the sum database: both lag fresh tags, and both are immutable,
  # so a tag ever recreated at different content (a rolled-back run) leaves
  # the proxy's first copy pinned for good and every checksum check failing.
  GOPRIVATE: github.com/yohimik/dispat

# A release pushes tags, a branch, gh-pages and four images. dispat's own
# release lock would refuse the second run, but it would refuse it partway in;
# queueing here means the second dispatch simply waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Is there anything to release
    runs-on: ubuntu-latest
    outputs:
      releasing: ${{ steps.status.outputs.releasing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0      # full history: dispat reads tags and commit ranges

      # A docker-container builder for the bootstrap build, and the runtime
      # action to hand the ACTIONS_* cache credentials into run steps: the
      # gha cache backend that scripts/buildx-cache.sh emits flags for
      # authenticates with them, and the runner only gives them to actions.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Set up dispat
        uses: ./

      # The bootstrap-then-fresh pair (see the workflow's env comment): the
      # gate's answer must come from the same dispat that would perform the
      # release, not from the release before it.
      - name: Build dispat from the checkout
        run: |
          # buildx-cache emits separate CLI arguments by design.
          # shellcheck disable=SC2046
          docker buildx build --file services/dispat/Dockerfile --target bootstrap-export \
            $(sh scripts/buildx-cache.sh bootstrap) \
            --output "type=local,dest=$RUNNER_TEMP/dispat-fresh" .
          echo "$RUNNER_TEMP/dispat-fresh" >> "$GITHUB_PATH"

      # `status` computes the plan and prints it without building, tagging or
      # writing anything. --require-release answers with exit 3 when the plan
      # releases nothing — the whole answer this job exists for — and exit 1
      # when something is wrong, so the mapping is a `case` rather than an
      # `if`: an `if` would read a broken configuration as "nothing to
      # release" and skip the release instead of failing.
      - name: Compute the plan
        id: status
        run: |
          rc=0
          dispat status --require-release || rc=$?
          case "$rc" in
            0) echo "releasing=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "releasing=false" >> "$GITHUB_OUTPUT"
              echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "No package has commits since its last tag. The release was not attempted." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$rc" ;;
          esac

  ping:
    name: Do the announcement's credentials still work
    needs: plan
    if: needs.plan.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    # The credentials the announcement will use, checked up front with
    # `crier ping`, which is read-only and posts nothing, so a revoked or
    # expired token fails the run in a minute instead of surfacing as a
    # skipped announcement after the release already spent twenty. Job-level
    # env for the same reason as the release job: a step's `if` is evaluated
    # before its own `env`.
    #
    # No secrets, no gate: a repository without the announcement secrets skips
    # the ping and releases without announcing, exactly as before.
    env:
      CRIER_PUBLISH_INSTAGRAM_TOKEN: ${{ secrets.CRIER_PUBLISH_INSTAGRAM_TOKEN }}
      CRIER_PUBLISH_INSTAGRAM_USER_ID: ${{ secrets.CRIER_PUBLISH_INSTAGRAM_USER_ID }}
      CRIER_PUBLISH_LINKEDIN_TOKEN: ${{ secrets.CRIER_PUBLISH_LINKEDIN_TOKEN }}
      CRIER_PUBLISH_LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_URN }}
      CRIER_PUBLISH_DISCORD_WEBHOOK_URL: ${{ secrets.CRIER_PUBLISH_DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up dispat
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != '' || env.CRIER_PUBLISH_LINKEDIN_TOKEN != '' || env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN != '' || env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL != ''
        uses: ./

      # Aqua installs the Crier version recorded in .aqua/aqua.yaml.
      # The verified standalone executable is carried into the release job.
      - name: Install crier
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != '' || env.CRIER_PUBLISH_LINKEDIN_TOKEN != '' || env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN != '' || env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/install-tools.sh crier ping-bin

      # Check every configured destination, including incomplete credentials
      # that must block the release. stdin is closed
      # because the announce config reads its data document from it.
      - name: Install story encoder for the gate
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != ''
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Ping the announcement's platforms
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != '' || env.CRIER_PUBLISH_LINKEDIN_TOKEN != '' || env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN != '' || env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL != ''
        run: |
          instagram=false
          linkedin=false
          discord=false
          [ -z "$CRIER_PUBLISH_INSTAGRAM_TOKEN$CRIER_PUBLISH_INSTAGRAM_USER_ID" ] || instagram=true
          [ -z "$CRIER_PUBLISH_LINKEDIN_TOKEN$CRIER_PUBLISH_LINKEDIN_AUTHOR_URN" ] || linkedin=true
          [ -z "$CRIER_PUBLISH_DISCORD_WEBHOOK_URL" ] || discord=true
          ./ping-bin/crier ping --config announce/crier.yaml \
            --publish-instagram-enabled="$instagram" \
            --publish-linkedin-enabled="$linkedin" \
            --publish-discord-enabled="$discord" \
            </dev/null

      # The release uses the exact executable that passed this gate.
      - name: Keep the verified crier
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != '' || env.CRIER_PUBLISH_LINKEDIN_TOKEN != '' || env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN != '' || env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: announcement-crier
          path: ping-bin/crier
          if-no-files-found: error
          retention-days: 1

      - name: Nothing to ping
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN == '' && env.CRIER_PUBLISH_INSTAGRAM_USER_ID == '' && env.CRIER_PUBLISH_LINKEDIN_TOKEN == '' && env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN == '' && env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL == ''
        run: echo "no announcement secrets; the release will skip the announcement"

  tests:
    name: Full suite
    needs: plan
    if: needs.plan.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the badge branch
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # See the plan job: the builder the suite's buildx builds run on, and
      # the cache credentials for them.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Set up dispat
        uses: ./

      # The bootstrap-then-fresh pair, as in the plan job.
      - name: Build dispat from the checkout
        run: |
          # buildx-cache emits separate CLI arguments by design.
          # shellcheck disable=SC2046
          docker buildx build --file services/dispat/Dockerfile --target bootstrap-export \
            $(sh scripts/buildx-cache.sh bootstrap) \
            --output "type=local,dest=$RUNNER_TEMP/dispat-fresh" .
          echo "$RUNNER_TEMP/dispat-fresh" >> "$GITHUB_PATH"

      # The bracket the release binary build puts around itself, put around the
      # suite as well: `link` writes the replace directives into
      # services/dispat/go.mod, so the tests run in the same module state a
      # release build does rather than leaving go.work to stand in for it. The
      # pkg/* versions that go.mod pins are only as fresh as the last release
      # that bumped them, and this is the gate immediately before the one that
      # ships the working tree.
      #
      # `link` and `unlink` are the scripts in services/dispat/dispat.yaml, so
      # the gate and the release cannot disagree about what the bracket is.
      - name: Link the workspace dependencies
        run: dispat run link --since all -p dispat

      # --since all, not a window: this is the gate on a release, so every
      # package's tests run whether or not it changed. It is also the only run
      # that produces a complete set of coverage profiles, which is why the
      # badge is computed here and nowhere else.
      - name: Run every package's tests
        run: dispat run tests --since all

      # always(): the redirects must not outlive the job whatever the suite
      # did, and unlink is idempotent, so closing an already-closed bracket is
      # a no-op. verify-unlinked catches both ways it leaks — a surviving
      # replace directive, and the go.sum entries anything that reconciles the
      # workspace drops while the links are in place.
      - name: Unlink the workspace dependencies
        if: always()
        run: |
          dispat run unlink --since all -p dispat
          dispat run verify-unlinked --since all -p dispat

      # The two steps below run through `dispat exec` so the release logic
      # they carry is dispat.yaml's, and this workflow stays plumbing: what
      # remains here is checkouts and Docker plumbing.
      #
      # The site's report used to be built here as well and handed to the
      # release job as an artifact. It is the release run's own now — the docs
      # package measures it in a beforeBuild hook, from the same buildx stages
      # this job just built, so the numbers the site ships are the release's
      # rather than a courier's. This job stays the gate it always was.
      - name: Compute coverage totals
        run: dispat exec coverage-badge

      - name: Upload merged coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage/coverage.out
            coverage/coverage.json
          retention-days: 7

      - name: Push badge JSON to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dispat exec push-badge

  release:
    name: Run dispat, publish binaries
    needs: [tests, ping]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commits, tags, GitHub releases
      id-token: write     # the OIDC token Workload Identity Federation trades
    outputs:
      cli-released: ${{ steps.dispat.outputs.cli-released }}
      cli-version: ${{ steps.dispat.outputs.cli-version }}
    # The announcement's secrets live on the job rather than on the steps that
    # use them, because a step's `if` is evaluated before its own `env`, and
    # the ngrok install has to be able to ask whether there is a token before
    # spending a minute on apt.
    #
    # Unconfigured platforms are optional. Incomplete or invalid credentials
    # fail the ping gate; publication failures are reported by the release.
    #
    # CRIER_STAGE_MODE is a repository variable rather than a secret, and it
    # is the escape hatch from the tunnel: setting it to s3 or url points the
    # staging somewhere that needs no ngrok.
    env:
      CRIER_PUBLISH_INSTAGRAM_TOKEN: ${{ secrets.CRIER_PUBLISH_INSTAGRAM_TOKEN }}
      CRIER_PUBLISH_INSTAGRAM_USER_ID: ${{ secrets.CRIER_PUBLISH_INSTAGRAM_USER_ID }}
      CRIER_PUBLISH_LINKEDIN_TOKEN: ${{ secrets.CRIER_PUBLISH_LINKEDIN_TOKEN }}
      CRIER_PUBLISH_LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_URN }}
      CRIER_PUBLISH_DISCORD_WEBHOOK_URL: ${{ secrets.CRIER_PUBLISH_DISCORD_WEBHOOK_URL }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      CRIER_STAGE_MODE: ${{ vars.CRIER_STAGE_MODE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0      # full history: dispat reads tags and commit ranges

      # The docker space builds two architectures per image, so the arm64 legs
      # run emulated. The containerd image store is what lets a multi-platform
      # `docker compose build` keep its manifest list locally for the push that
      # follows; without it the build has nowhere to put the result.
      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      # Google Cloud, for the infra package's terraform stages and the docs
      # deploy. auth trades the job's OIDC token for the releaser service
      # account through Workload Identity Federation, so no key exists
      # anywhere; the provider and account names are identifiers this
      # repository deliberately does not carry, hence the secrets. The
      # credential files it writes land in the workspace, and the stage
      # scripts mount the workspace into the release tools image at the same
      # absolute path, so the CLOUDSDK_*/GOOGLE_* variables it exports name
      # paths that resolve in there unchanged — no gcloud or terraform is
      # installed on the runner.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASER_SA }}

      - name: Set up dispat
        uses: ./

      # The bootstrap-then-fresh pair, as in the plan job. Here it is what
      # writes the records: the changelogs, the commits, the tags and the
      # GitHub releases of this run come from the checkout being released,
      # not from the release before it.
      - name: Build dispat from the checkout
        run: |
          # buildx-cache emits separate CLI arguments by design.
          # shellcheck disable=SC2046
          docker buildx build --file services/dispat/Dockerfile --target bootstrap-export \
            $(sh scripts/buildx-cache.sh bootstrap) \
            --output "type=local,dest=$RUNNER_TEMP/dispat-fresh" .
          echo "$RUNNER_TEMP/dispat-fresh" >> "$GITHUB_PATH"

      # Bootstrap the latest Aqua through Dispat, then install the pinned
      # Crier executable. TinyGo is installed by Aqua inside its Docker stage.
      - name: Install the tools the release needs
        env:
          DISPAT_BIN_DIR: ${{ runner.temp }}/dispat-fresh
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/install-tools.sh crier

      - name: Download the crier that passed ping
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != '' || env.CRIER_PUBLISH_LINKEDIN_TOKEN != '' || env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN != '' || env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: announcement-crier
          path: ${{ runner.temp }}/verified-crier

      - name: Use the verified crier for announcements
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != '' || env.CRIER_PUBLISH_INSTAGRAM_USER_ID != '' || env.CRIER_PUBLISH_LINKEDIN_TOKEN != '' || env.CRIER_PUBLISH_LINKEDIN_AUTHOR_URN != '' || env.CRIER_PUBLISH_DISCORD_WEBHOOK_URL != ''
        run: |
          chmod +x "$RUNNER_TEMP/verified-crier/crier"
          echo "ANNOUNCE_CRIER_BIN=$RUNNER_TEMP/verified-crier/crier" >> "$GITHUB_ENV"

      # Instagram fetches the media from a public URL of its own accord and a
      # runner has none, so the stage server needs a tunnel. Installed only
      # when there is a token to run it with, since the whole announcement is
      # skipped without one.
      - name: Install ngrok
        if: env.NGROK_AUTHTOKEN != ''
        run: |
          set -eu
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc |
            sudo gpg --dearmor -o /etc/apt/keyrings/ngrok.gpg
          echo "deb [signed-by=/etc/apt/keyrings/ngrok.gpg] https://ngrok-agent.s3.amazonaws.com buster main" |
            sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngrok
          ngrok version

      # Instagram's cover story needs ffmpeg; all feed posts remain photos.
      - name: Install ffmpeg
        if: env.CRIER_PUBLISH_INSTAGRAM_TOKEN != ''
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1

      - name: Run the release
        id: dispat
        # dispat does the whole release itself: autoVersion rewrites, the
        # post-version test gates (flow.beforeBuild in the pkg and services
        # spaces), the release commit, tags, the push, and the GitHub release
        # with the cross-compiled binaries its containerised build stage
        # exported. The dispat package's announce stage writes this step's
        # cli-released / cli-version outputs and then posts the announcement,
        # and only fires when that package published; see
        # services/dispat/dispat.yaml.
        # GITHUB_REPOSITORY is set by Actions; the token is not, so pass it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The docker space's login stage authenticates the image pushes.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # The Google Cloud identifiers the infra and docs stages read; the
          # repository carries none of them, so this mapping is where each
          # value enters the run, set once at day zero (infra/README.md).
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_URL_MAP: ${{ vars.DOCS_URL_MAP }}
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_bucket_name: ${{ vars.DOCS_BUCKET }}
          TF_VAR_dns_zone: ${{ vars.DNS_ZONE }}
        # The checkout's own build leads PATH, so the nested `dispat
        # changelog` / `dispat commit` / `dispat if` invocations inside the
        # stage scripts resolve it too. The committer identity comes from
        # commit.name/commit.email in dispat.yaml.
        run: dispat --log-format json

      # The experiments' records, from the docs package's beforeBuild hook.
      # always(), because a cell that failed is the record most worth keeping:
      # it is what says which tool did what, and the run that failed is the one
      # somebody will want to read back. if-no-files-found: ignore, because a
      # run that never reached the docs package leaves the folder absent, which
      # is not a failure of this step.
      - name: Keep the experiments' records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experiments
          path: coverage/experiments
          if-no-files-found: ignore
          retention-days: 30

  post-release:
    name: ${{ matrix.os }}
    needs: release
    # Only when the CLI itself published. A run that released just the docs or
    # an image has no new version to install, no v{version} alias tag to check
    # out and no GitHub release carrying binaries.
    #
    # !cancelled(), because a bare condition implies success(): the CLI's leg
    # records itself mid-run, so a run that later failed on another package
    # still published a CLI worth checking — the announce stage set
    # cli-released before the failure, and skipping the check here would
    # leave exactly the releases that most need verifying unverified.
    if: ${{ !cancelled() && needs.release.outputs.cli-released == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The tag the release just wrote, rather than main, so this tests exactly
      # what was published even if something else has landed since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.release.outputs.cli-version }}

      # `uses: ./` is the action as a caller gets it, rather than the scripts
      # it happens to wrap: the inputs, the outputs and the PATH entry are all
      # part of what is being tested.
      - id: setup
        uses: ./
        with:
          version: ${{ needs.release.outputs.cli-version }}

      - name: The action installs what was just released
        shell: bash
        run: |
          sh scripts/check-action.sh \
            "${{ needs.release.outputs.cli-version }}" \
            "${{ steps.setup.outputs.version }}" \
            "${{ steps.setup.outputs.path }}"
