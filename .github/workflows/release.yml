name: Release

# Trigger only when a release tag of the CLI is pushed: the Go-module-style
# tag dispat's own config renders, "services/dispat/v<version>"
# (e.g. services/dispat/v1.0.0-rc.0).
on:
  push:
    tags:
      - 'services/dispat/v*'

permissions:
  contents: write

env:
  APP_NAME: dispat

jobs:
  tests:
    # A tag push does not trigger tests.yml, so the release re-runs the suite
    # against the tagged commit: no binary ships from a commit that fails.
    name: Test the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run the full suite
        run: |
          go test -C pkg/ccme         ./... -count=1 -timeout 10m
          go test -C pkg/manifest     ./... -count=1 -timeout 10m
          go test -C pkg/models       ./... -count=1 -timeout 10m
          go test -C pkg/scanner      ./... -count=1 -timeout 10m
          go test -C pkg/writer       ./... -count=1 -timeout 10m
          go test -C services/dispat  ./... -count=1 -timeout 10m
          go test -C tests/integration ./... -count=1 -timeout 20m

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # The version baked into `dispat --version`: the tag's version
          # section (services/dispat/v1.0.0-rc.0 -> 1.0.0-rc.0). Local builds
          # default to "dev".
          VERSION="${GITHUB_REF_NAME##*/v}"
          mkdir -p dist
          OUT_NAME="${APP_NAME}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -C services/dispat -trimpath \
            -ldflags="-s -w -X github.com/yohimik/dispat/services/dispat/internal/cli.Version=${VERSION}" \
            -o "${PWD}/dist/${OUT_NAME}" .
          echo "Built dist/${OUT_NAME} (version ${VERSION})"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected binaries
        run: ls -lh dist

      - name: Resolve the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME##*/v}" >> "$GITHUB_ENV"

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dispat ${{ env.VERSION }}
          # A version with a prerelease section (1.0.0-rc.0) is marked as a
          # GitHub prerelease, keeping it off the "latest" badge.
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}