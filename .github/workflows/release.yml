name: Release

# dispat releases itself: this workflow builds the CLI from the checkout and
# runs it against the repository. dispat computes the plan from the
# conventional commits, rewrites the go.mods (autoVersion), writes the
# changelogs, creates one release commit carrying all of it, tags every
# released module on that commit (pkg/<name>/v<version>,
# services/dispat/v<version>) and pushes the branch and the tags.
#
# Triggered manually: the tags do not exist before dispat creates them, and
# tags pushed with the workflow's own GITHUB_TOKEN would not re-trigger a
# tag-push workflow anyway, so the binary build and the GitHub release run
# right here, after the dispat run, keyed off the tag it created.
#
# Four jobs, in order: is there anything to release, does the whole suite pass,
# release it, then check that what was released installs. Each is a gate on the
# next, so nothing is published by a run whose tests never ran.
on:
  workflow_dispatch:

permissions:
  contents: write

# A release pushes tags, a branch, gh-pages and four images. dispat's own
# release lock would refuse the second run, but it would refuse it partway in;
# queueing here means the second dispatch simply waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Is there anything to release
    runs-on: ubuntu-latest
    outputs:
      releasing: ${{ steps.status.outputs.releasing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history: dispat reads tags and commit ranges

      # TEMPORARY BOOTSTRAP until 1.0.0: bin/dispat is the committed driver,
      # refreshed by scripts/refresh-bootstrap.sh, so this gate needs no Go
      # toolchain at all. Once a stable release exists this step becomes
      # `uses: ./` and bin/dispat is deleted.
      - name: Put the bootstrap dispat on PATH
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      # `status` computes the plan and prints it without building, tagging or
      # writing anything. --require-release answers with exit 3 when the plan
      # releases nothing — the whole answer this job exists for — and exit 1
      # when something is wrong, so the mapping is a `case` rather than an
      # `if`: an `if` would read a broken configuration as "nothing to
      # release" and skip the release instead of failing.
      - name: Compute the plan
        id: status
        run: |
          rc=0
          dispat status --require-release || rc=$?
          case "$rc" in
            0) echo "releasing=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "releasing=false" >> "$GITHUB_OUTPUT"
              echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "No package has commits since its last tag. The release was not attempted." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$rc" ;;
          esac

  tests:
    name: Full suite
    needs: plan
    if: needs.plan.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the badge branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # TEMPORARY BOOTSTRAP until 1.0.0: the committed driver, as in the plan
      # job. The driver is only the driver; the suite builds and tests the
      # checkout's own dispat regardless.
      - name: Put the bootstrap dispat on PATH
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      # The bracket the release binary build puts around itself, put around the
      # suite as well: `link` writes the replace directives into
      # services/dispat/go.mod, so the tests run in the same module state a
      # release build does rather than leaving go.work to stand in for it. The
      # pkg/* versions that go.mod pins are only as fresh as the last release
      # that bumped them, and this is the gate immediately before the one that
      # ships the working tree.
      #
      # `link` and `unlink` are the scripts in services/dispat/dispat.yaml, so
      # the gate and the release cannot disagree about what the bracket is.
      - name: Link the workspace dependencies
        run: dispat run link --since all -p dispat

      # --since all, not a window: this is the gate on a release, so every
      # package's tests run whether or not it changed. It is also the only run
      # that produces a complete set of coverage profiles, which is why the
      # badge is computed here and nowhere else.
      - name: Run every package's tests
        run: dispat run tests --since all

      # always(): the redirects must not outlive the job whatever the suite
      # did, and unlink is idempotent, so closing an already-closed bracket is
      # a no-op. verify-unlinked catches both ways it leaks — a surviving
      # replace directive, and the go.sum entries anything that reconciles the
      # workspace drops while the links are in place.
      - name: Unlink the workspace dependencies
        if: always()
        run: |
          dispat run unlink --since all -p dispat
          dispat run verify-unlinked --since all -p dispat

      - name: Compute coverage totals
        run: sh scripts/coverage-badge.sh

      - name: Upload merged coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/coverage.out
            coverage/coverage.json
          retention-days: 7

      # The same run, as the documentation site consumes it: per-package
      # coverage and what the suite actually did, from the profiles and the
      # `go test -json` logs the tests scripts left behind. It travels to the
      # release job as an artifact rather than a commit — the numbers describe
      # a run, not a revision, and the site is built there.
      - name: Build the test report
        run: go run github.com/yohimik/dispat/tools/testreport build -commit "$GITHUB_SHA"

      - name: Upload the test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: packages/docs/data/report.json
          retention-days: 7

      - name: Push badge JSON to the badges branch
        # A single-commit orphan branch, force-pushed on every release, so the
        # badge data carries no history. README references it through the
        # shields.io endpoint URL.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badge && cp coverage/coverage.json badge/
          cd badge
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -qm "chore: update coverage badge"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  release:
    name: Run dispat, publish binaries
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      cli-released: ${{ steps.dispat.outputs.cli-released }}
      cli-version: ${{ steps.dispat.outputs.cli-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history: dispat reads tags and commit ranges

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The docs package's version stage shells out to pnpm, as does the
      # packages space's syncLock; the pnpm workspace at the repository root is
      # the only Node in this project. The site build itself is containerised
      # and needs none of this. action-setup takes its version from
      # packageManager in package.json, and must run before setup-node, whose
      # pnpm cache needs pnpm on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packages/docs/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The docker space builds two architectures per image, so the arm64 legs
      # run emulated. The containerd image store is what lets a multi-platform
      # `docker compose build` keep its manifest list locally for the push that
      # follows; without it the build has nowhere to put the result.
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # This job alone rebuilds the driver from the checkout: it is about to
      # write the changelogs, the release commit and the tags of the version
      # being shipped, and a committed driver lagging the checkout would
      # silently skip configuration the new version defines. The same
      # containerised build the bootstrap refresh uses, overwriting bin/dispat
      # in the workspace only — at 1.0.0 this becomes the composite action
      # installing the previous published release.
      - name: Build a fresh driver from the checkout
        run: sh scripts/refresh-bootstrap.sh

      - name: Put the fresh dispat on PATH
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      # The test report from the job that gated this one, put where the docs
      # package's build expects it. Deliberately not tolerant of a missing
      # artifact: the site that ships must carry the numbers of the run that
      # let it ship, and a silently numberless page is worse than a failed job.
      # The docs build refuses to produce a release site without it either —
      # see DOCS_REQUIRE_REPORT in dispat.yaml.
      - name: Fetch the test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: packages/docs/data

      - name: Run the release
        id: dispat
        # dispat does the whole release itself: autoVersion rewrites, the
        # release commit, tags, the push, and the GitHub release with the six
        # cross-compiled binaries its containerised build stage exported. The
        # run.postAll hook writes this step's cli-released / cli-version
        # outputs; see the post-release scripts in dispat.yaml.
        # GITHUB_REPOSITORY is set by Actions; the token is not, so pass it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The syncLock `go mod tidy` and the module-mode binary builds must
          # resolve the dependency tags this same run just pushed: fetch our
          # own modules directly from the repository, skipping the proxy and
          # the sum database, both of which lag fresh tags.
          GOPRIVATE: github.com/yohimik/dispat
          # The docker space's login stage authenticates the image pushes.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        # bin/ leads PATH so the nested `dispat changelog` / `dispat commit` /
        # `dispat if` invocations inside the stage scripts resolve the same
        # freshly built driver. The committer identity comes from
        # commit.name/commit.email in dispat.yaml.
        run: dispat --log-format json

  post-release:
    name: ${{ matrix.os }}
    needs: release
    # Only when the CLI itself published. A run that released just the docs or
    # an image has no new version to install, no v{version} alias tag to check
    # out and no GitHub release carrying binaries.
    if: needs.release.outputs.cli-released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The tag the release just wrote, rather than main, so this tests exactly
      # what was published even if something else has landed since.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.cli-version }}

      # `uses: ./` is the action as a caller gets it, rather than the scripts
      # it happens to wrap: the inputs, the outputs and the PATH entry are all
      # part of what is being tested.
      - id: setup
        uses: ./
        with:
          version: ${{ needs.release.outputs.cli-version }}

      - name: The action installs what was just released
        shell: bash
        run: |
          sh scripts/check-action.sh \
            "${{ needs.release.outputs.cli-version }}" \
            "${{ steps.setup.outputs.version }}" \
            "${{ steps.setup.outputs.path }}"
