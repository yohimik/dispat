# Entry configuration for one distributed release. The first node is the
# orchestrator. It also runs eligible work and is the only node that advances
# canonical task, ledger and release refs, publishes artifacts, and writes
# canonical release records. Workers create their own pickup branches.
#
# Start with `dispat release --distribution-mode=compilation` (the default) to
# plan and assign ready work here. Other modes are not available in this build.
# Start peers with dispat.example.choreographer.yaml and `dispat choreographer`.
# Supply DISPAT_EXECUTION_SECRET and publication credentials outside this file.

execution:
  concurrency: 2
  secretEnv: DISPAT_EXECUTION_SECRET
  choreographers:
    - name: build-a
    - name: build-b
    - name: build-arm
  timeouts:
    preflight: 60
    task: 3600
    cancel: 60
  transfer:
    maxFiles: 20000
    maxBytes: 2147483648
    maxManifestBytes: 8388608
    maxPackBytes: 4294967296
    timeout: 1800

scripts:
  install: "npm ci"
  build: "npm run build"
  publish: "npm publish --access public"
  npm-login: "npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN"
  npm-lock: "npm install --package-lock-only"
  smoke-test: "npm run smoke"

# Explicit build outputs are captured and verified for consumers, including
# ignored products such as dist. A root replaces the inherited list whole.
buildOutputs: [dist]

spaces:
  web:
    path: packages
    autoVersion:
      range: caret
      syncLock: [npm-lock]
      syncLockConcurrency: 1
    flow:
      build: [install, build]
      postBuild: smoke-test
      login: npm-login
      publish: publish  # publication always stays on the orchestrator

packages:
  assets:
    buildOutputs: [dist, generated/types]
  ui:
    runOnly: [both, orchestrator]
  docs:
    buildPlatforms: [linux/amd64, linux/arm64]
  app:
    buildOutputs: [dist, bin]
    runOnly: orchestrator

dependencies:
  ui: [assets]
  docs:
    - provider: assets
      kind: devDependencies
  app: [ui, docs]

# Run-wide build and publish budgets; node concurrency above is separate.
concurrency: [4, 1]
unsafeDisableLock: false

commit:
  enabled: true
  push: true
  include: [package-lock.json]

logFormat: json
