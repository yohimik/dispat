# A worker node: the whole file a machine needs to serve release tasks.
#
#   export DISPAT_EXECUTION_SECRET=...  # the secret the orchestrator holds
#   export NPM_TOKEN=...                # whatever the commands it runs need
#   dispat worker --config dispat.worker.yaml
#
# A worker states no spaces, packages, scripts or release policy. The
# orchestrator's assignment carries the commands, the environment names and
# the exact source revision, and the worker runs them in a checkout of its own.
# It needs no checkout of the repository beforehand, and the folder it is
# started in does not have to be a Git repository.
#
#   --state-dir <dir>      where the object cache, the task checkouts and the
#                          record of answered work live (default: the user
#                          cache folder). Everything in it can be deleted
#                          between tasks; it is rebuilt.
#   --idle-timeout <sec>   exit 0 after this long with no work, which is how a
#                          CI job serves one release and ends. 0 serves until
#                          it is signalled.

execution:
  # A worker refuses to start a release, including one a task script tries to
  # start. A node with role: orchestrator may also run `dispat worker`: for
  # each task it serves it has a worker's authority and never consults its own
  # worker list.
  role: worker
  # This node's identity. It must match the `name` of the worker link in the
  # orchestrator's file, and it is how the node finds the coordination
  # branches addressed to it. Letters, digits, dot, underscore and hyphen,
  # with no two dots in a row.
  name: build-a
  # The Git repository this node reads assignments from and answers in: the
  # same value as the link's `endpoint`. No credentials in the address; Git's
  # own credentials reach it. No port is opened and nothing connects to this
  # machine: the node polls, so it runs behind NAT and on hosted CI runners.
  endpoint: git@github.com:acme/release-mailbox.git
  # The name of the variable holding the signing secret. A message that does
  # not verify under it is refused with a reason and never run.
  secretEnv: DISPAT_EXECUTION_SECRET
  # How many assigned tasks this node runs at once, counted across every run
  # that reaches it. Work it has no free slot for waits in the mailbox.
  concurrency: 2
  # What this node accepts as one task's build outputs. A run whose own
  # ceilings are higher than a worker's is refused before dispatch.
  transfer:
    maxFiles: 20000
    maxBytes: 2147483648
    maxManifestBytes: 8388608
    timeout: 1800

logLevel: info
logFormat: json
