# One peer node in a distributed release. Start it with:
#   dispat worker --config dispat.example.worker.yaml
#
# The first node is the orchestrator. It also executes ordinary tasks and is
# the only node that pushes Git refs, publishes artifacts and writes release
# records. This node reads exact pinned inputs and sends authenticated claim
# and result requests through the non-Git return channel. Give it no Git-push
# or publication credentials. Supply the shared signing secret through the
# named environment variable, never in this file.

execution:
  # Match this identity to one entry of the orchestrator's
  # execution.workers list.
  name: build-a
  # Read-only Git access to the repository holding pinned inputs and task
  # state. With no endpoint, start this node in the repository checkout so
  # dispat can resolve its release remote.
  endpoint: git@github.com:acme/project.git
  secretEnv: DISPAT_EXECUTION_SECRET
  # Local simultaneous task limit, counted across runs.
  concurrency: 2
  transfer:
    maxFiles: 20000
    maxBytes: 2147483648
    maxManifestBytes: 8388608
    maxPackBytes: 4294967296
    timeout: 1800

logLevel: info
logFormat: json
