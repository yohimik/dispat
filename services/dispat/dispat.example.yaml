# Same configuration as dispat.example.json in YAML. dispat defaults to
# dispat.json; point at this file with: dispat --config dispat.yaml
scripts:
  install: "npm ci"
  build: "npm run build"
  publish: "npm publish --access public"
  # Sync manifests to just-released provider versions; receives them as
  # per-package DISPAT_UPDATED_* variables.
  sync-deps: "node ./scripts/sync-deps.js"
  npm-login: "npm whoami || npm login"
  smoke-test: "npm run smoke"
  announce: "./scripts/announce.sh"
  build-go: "go build ./..."
  publish-go: "./scripts/release.sh"
  notify: "./scripts/notify.sh"

# A space's `flow` object says what runs at which stage, referencing the named
# scripts above. Every entry is optional (a stage without a script still runs,
# keeping ordering, tags, changelogs and github releases; it just executes no shell
# command) and accepts one name or an array of names run in order.
spaces:
  libs:
    path: packages/libs
    # Consumers may only build after a provider from this space is published.
    isBuildWaitingPublish: true
    # Roll back all local changes inside the package folder when a package
    # from this space fails during version, build or publish.
    revertOnFail: true
    # How versions relate across the space's packages:
    #   independent (default)  every package versions from its own history
    #   fixed                  one shared version: any change releases every
    #                          member; single prerelease train; riders get a
    #                          "no changes" changelog entry (W210)
    #   fixedSparse            the shared version, but unchanged members keep
    #                          their previous versions until they change
    versioning: independent
    # Named shell commands (NOT references into `scripts`) for `dispat run
    # <name>` (or just `dispat <name>`): executed inside each changed package
    # over the dependency graph with the full DISPAT_* environment; nothing
    # is released or tagged. --on-error picks skip/continue for dependents of
    # a failed package; --concurrency's build value bounds the parallelism.
    runScripts:
      lint: "npm run lint"
    flow:
      build: [install, build]
      publish: publish
      version: sync-deps
      # Runs once per space, before the space's first publish; every other
      # publish of the space waits for it, and its failure fails them all.
      login: npm-login
      # Hooks around the package stages (beforeAll, beforeVersion,
      # postVersion, beforeBuild, postBuild, beforePublish, postPublish,
      # beforeAnnounce, postAnnounce). Everything up to beforePublish gates
      # the release, so a failure fails the package; postPublish and the
      # announce hooks warn. onFail / onSkip run when a package fails or is
      # skipped, warn-only.
      postBuild: smoke-test
      # A fourth stage after a successful publish: push the release out to
      # update channels. Receives DISPAT_BREAKING_CHANGES / DISPAT_FEATURES /
      # DISPAT_FIXES (the changelog's groupings) and only warns on failure.
      announce: announce
  apps:
    path: packages/apps
    isBuildWaitingPublish: false
    flow:
      build: build-go
      publish: publish-go
    # Overrides the repository-wide tagFormat for this space only.
    tagFormat: "packages/apps/{name}@v{version}"

# The top-level `run` object holds the run-level hooks, executed in the
# monorepo root. beforeAll is the one gating run hook: it runs once before
# the task graph starts and its failure aborts the run. All the others only
# warn on failure. postAll runs once after the whole task graph finishes with
# the run outcome in DISPAT_PUBLISHED/FAILED/SKIPPED/UNPLANNED_PACKAGES and
# DISPAT_RESULT_* variables. The commit hooks (beforeCommit, afterCommit,
# postCommit) and push hooks (beforePush, afterPush) bracket the finalize
# phase when commit/push are enabled.
run:
  # beforeAll: check-preconditions
  postAll: notify

dependencies:
  - consumer: app
    provider: core
  - consumer: app
    provider: utils

# Baseline versions used when a package's latest tag is missing or cannot be
# parsed (e.g. a stray core@0.0.1.0). The next release bumps on top of
# this value; a parseable latest tag always wins over initials.
initials:
  core: 1.0.0

# Release tag template, overridable per space above. Placeholders are {name},
# {version}, and optionally {channel} with {counter} to spell prereleases your
# own way ("{name}@v{version}-{channel}{counter}" tags core@v1.2.3-beta4, and
# core@v1.2.3 when stable; the prerelease section and its glued literals are
# dropped). Every other byte is literal, so "v" prefixes and path prefixes
# both work. A tag that matches the shape but whose version cannot be parsed
# puts the package on the `initials` fallback, exactly as before.
tagFormat: "{name}@{version}"

# What an error in a commit message does to the run:
#   warn  (default) the offending unit contributes nothing and the run
#                   continues, which is the blast radius the spec assigns to
#                   unit-scoped errors
#   error           any commit error stops the run before anything is released
# Repository-scoped failures (an unreadable tag, a version that would go
# backwards, a dependency cycle) abort under either setting.
commitErrors: warn

# Scope names that are deliberately not packages, so naming one is not the
# typo that an unknown-package error exists to catch. "release" is dispat's
# own release-commit scope: without the exemption every run would leave an
# error behind for the next one.
nonPackageScopes: [release]

# One value for both stages (concurrency: 4) or [build, publish].
# 0 means "number of CPUs".
concurrency: [4, 2]

# Minimum log level: trace, debug, info (default), warn or error.
logLevel: info

# Logger output: pretty (default, human console output) or json (machine-
# readable lines for CI ingestion).
logFormat: pretty

# Per-package changelog file; enabled by default. All fields optional.
changelog:
  enabled: true
  file: CHANGELOG.md
  title: "# Changelog"
  dateFormat: "2006-01-02"
  breakingTitle: "Breaking Changes"
  featuresTitle: "Features"
  fixesTitle: "Fixes"
  dependenciesTitle: "Dependencies"

# Optional finalize phase (disabled by default): one release commit capturing
# changelog/manifest changes of all published packages (tags then point at
# it), optionally pushed together with the tags. Remote access is verified
# before any release work starts.
commit:
  enabled: false
  messageFormat: "chore(release): {tags}"  # {tags}, {packages}
  push: false
  remote: origin
  verify: true   # ls-remote check before any work when push is enabled

# Shell used for all scripts; default /bin/sh -c.
# shell: ["bash", "-c"]

# Commit-message parser options; everything unset keeps the specification
# default, so the whole object is optional. `types` REPLACES the standard
# table wholesale (feat=minor, fix/perf/revert=patch, the rest none), so list
# every type you keep. propagation.depth is the knob that turns propagation
# from opt-in (0, the default) to on-by-default (1 reaches direct consumers
# with no caret written); a directive on the unit always wins.
# parser:
#   separator: "---"
#   types: { feat: minor, fix: patch, perf: patch, revert: patch, docs: patch }
#   strictTypes: false
#   lenient: false
#   maxDescriptionLength: 100
#   propagation:
#     bump: patch
#     depth: 0            # or a number of edges, or "all"
#     channelDepth: 0
#     kinds: [dependencies, peerDependencies, optionalDependencies]
#     channel: inherit
#   limits: { unitsPerMessage: 64, scopeTermsPerUnit: 256, messageBytes: 1048576 }
#   allowedChannels: [beta, rc]

# GitHub release per published package that exported DISPAT_EXPORT_GITHUB;
# the recorder is enabled by default (needs a repo and token: owner/repo here
# or $GITHUB_REPOSITORY, token in $GITHUB_TOKEN or the env var named by
# tokenEnv) but skips packages without the export. Same format fields as
# changelog. Any script may export values GITHUB_OUTPUT-style through
# $DISPAT_OUTPUT (they reach later scripts as DISPAT_OUTPUT_*, with
# DISPAT_OUTPUT_SOURCE_* naming the exporter); the DISPAT_EXPORT_GITHUB
# export (echo "DISPAT_EXPORT_GITHUB=$PWD/dist/app.tgz" >> "$DISPAT_OUTPUT")
# opts the package in, its absolute file paths uploaded as release assets
# (invalid entries skipped with a warning).
github:
  enabled: true
  owner: acme
  repo: monorepo
  apiUrl: https://api.github.com
  tokenEnv: GITHUB_TOKEN
  featuresTitle: "Features"
