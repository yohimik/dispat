# The dispat package's own configuration: the CLI's alias tags, the local-link
# bracket its build wraps around itself, and the split test suites. The
# dispat.example.* files beside this one are documentation samples, not
# configuration; dispat resolves the exact names dispat.{json,yaml,yml,toml}.
versionGroup: cli
dependencies:
  - config
  - manifest
  - models
  - scanner
  - writer
  # `dispat --help` links the agent skill at this release's own tag, so the
  # guide a release ships is published first. No manifest states the edge,
  # which is why it is kept.
  - provider: agent-guide
    keep: true
aliasTags:
  - format: v{version}
  - format: v{major}
    moving: true
    channels: [stable]
scripts:
  # The binaries are built against this checkout, not against the
  # pkg/* versions go.mod happens to pin: those pins are only as fresh
  # as the last release that bumped them, so a provider changed without
  # a version bump would ship as its published copy while every test in
  # CI ran the working tree. link points each workspace dependency at
  # its folder; unlink takes the redirects back out.
  #
  # The bracket is inside the build rather than around it, as
  # beforeBuild/postBuild hooks, because those are the release
  # pipeline's and `dispat run build` — which is the CI build gate —
  # executes the named script and nothing else. A bracket in the hooks
  # would leave the gate compiling against the published pkg/*, which
  # is exactly the mistake the bracket exists to prevent, and it would
  # fail only in CI. flow.onFail keeps unlink as the release's net.
  link: dispat autowriter --package dispat --since all --sync-lock=false --link-local
  unlink: dispat autowriter --package dispat --since all --sync-lock=false --unlink-local
  # The two ways the bracket leaks, both of which only fail for whoever
  # consumes the published module, long after the tag exists. The
  # first is the scanner's own gate, which reads the replace directives
  # the way go.mod means them (a parenthesised block included) instead
  # of grepping for one spelling. The second is the quieter leak:
  # `go work sync`, and anything else that reconciles the workspace
  # while the links are in place, drops the go.sum entries the
  # redirects made redundant, and that is a toolchain fact no manifest
  # scan can see, so it stays a grep.
  verify-unlinked: |
    dispat scanner --root-only --verify-unlinked || exit 1
    phase=pre
    case "${DISPAT_STAGE:-}" in build|test) phase=post ;; esac
    sh ../../scripts/verify-go-sums.sh go.mod go.sum "$phase"
  # The release build: the binaries, exported into dist/. DIST_DIR is
  # exported for the test stage, which checks exactly this folder.
  release-build:
    - dispat exec link --for pkg:dispat
    # DISPAT_EXPORT_BASE is where the export is about to land, which is
    # the one thing the container cannot work out for itself: it names
    # its artefacts against that path, so what comes back needs no
    # rewriting here.
    #
    # The token rides in as a build secret, and only when there is one:
    # the tiny-toolchain stage installs the TinyGo fork through Aqua,
    # bootstrapped by dispat; its API requests meet the
    # unauthenticated rate limit on a runner sharing its IP. The
    # ${VAR:+...} form passes no flag at all outside CI, where an empty
    # env=GITHUB_TOKEN would fail the build for want of a variable.
    - >-
      docker buildx build --file Dockerfile --target export
      --build-arg DISPAT_VERSION="$DISPAT_NEW_VERSION"
      --build-arg DISPAT_EXPORT_BASE="$PWD/dist"
      ${GITHUB_TOKEN:+--secret id=GITHUB_TOKEN,env=GITHUB_TOKEN}
      --output "type=local,dest=$PWD/dist" ../..
    # Already this stage's outputs, in $DISPAT_OUTPUT's own format. A
    # nested `dispat exec`, which is how the CI build gate below runs this
    # script, has no output file, and /dev/null takes the lines nobody reads.
    - cat dist/dispat-output >> "${DISPAT_OUTPUT:-/dev/null}"
    - rm -f dist/dispat-output
    - echo "DIST_DIR=$PWD/dist" >> "${DISPAT_OUTPUT:-/dev/null}"
    - dispat exec unlink --for pkg:dispat
    # Checked here rather than on the way out, so a leak fails the
    # build, which is still ahead of anything being published.
    - dispat exec verify-unlinked --for pkg:dispat
  # The smoke gate over the folder the build exported: every binary is
  # validated, the linux binaries are executed, the TinyGo binary carries
  # the whole integration suite and the gc one the e2e smoke suite. The
  # dist build context replaces the Dockerfile's own build of the
  # binaries, so what is checked is the bytes about to be published. The
  # fixture binaries the gate compiles read pkg/* through the same link
  # bracket the build holds. A run with no build output to read, such as
  # the CI build gate below, checks dist/ in this folder.
  smoke:
    - dispat exec link --for pkg:dispat
    - >-
      docker buildx build --file Dockerfile --target test
      --build-arg DISPAT_VERSION="$DISPAT_NEW_VERSION"
      --build-context dist="${DISPAT_OUTPUT_DIST_DIR:-$PWD/dist}"
      ${GITHUB_TOKEN:+--secret id=GITHUB_TOKEN,env=GITHUB_TOKEN}
      --output type=cacheonly ../..
    - dispat exec unlink --for pkg:dispat
    - dispat exec verify-unlinked --for pkg:dispat
  # The CI build gate `dispat run build` executes: the release build and
  # the smoke gate over what it exported, which is what the release runs
  # as its build and test stages.
  build:
    - dispat exec release-build --for pkg:dispat
    - dispat exec smoke --for pkg:dispat
  # Both suites run as builds of the shared Dockerfile.gotest — the unit
  # target and the black-box target — through `testreport test` inside, so
  # each run leaves its machine-readable log beside its profile and the job
  # needs Docker and nothing else. The exports land the profiles and logs in
  # coverage/, exactly where the host runs always put them.
  tests:unit: >-
    docker buildx build --file ../../Dockerfile.gotest --target export-dispat
    $(sh ../../scripts/buildx-cache.sh gotest-dispat)
    --output type=local,dest=../../coverage ../..
  # The black-box suite of exactly this checkout's dispat, so it belongs to
  # this package rather than to a space of its own. Inside the target,
  # DISPAT_COVERDIR makes the harness build dispat with -cover and point
  # every invocation's GOCOVERDIR at the folder, which is the only coverage
  # much of the app and cli packages get; the covdata is condensed to
  # integration.out before export. The race pass runs the root package only,
  # as it always has, and keeps its own log so the report can say the suite
  # is race-clean rather than have someone assert it.
  tests:integration: >-
    docker buildx build --file ../../Dockerfile.gotest --target export-integration
    $(sh ../../scripts/buildx-cache.sh gotest-integration)
    --output type=local,dest=../../coverage ../..
  tests: dispat exec tests:unit --for pkg:dispat
  # The post-version gate the services space hooks into beforeBuild: the unit
  # suite against this module as autoVersion rewrote it and syncLock tidied
  # it, resolving the pkg/* tags the earlier legs of this run pushed, with no
  # workspace and no link bracket. The bracketed binary build proves the
  # checkout; this proves the published module a `go install` consumer gets.
  tests:release: >-
    docker buildx build --file ../../Dockerfile.gotest --target release-test
    --build-arg MODULE=services/dispat
    $(sh ../../scripts/buildx-cache.sh release-dispat)
    --output type=cacheonly ../..
  # What the release did, as step outputs for the job that verifies the
  # composite action afterwards. It is the postPublish hook, which runs only
  # after this package's own publish succeeded, so the hook firing is the whole
  # condition: a run that publishes only the docs or an image never reaches
  # it, leaves cli-released unset, and the workflow's `== 'true'` reads that as
  # no new CLI to install. It is apart from the announcement on purpose: the
  # post-release job's condition must not depend on whether a social network
  # answered, and the announcement is the docs package's, posted once the site
  # it links to is live (packages/docs/dispat.yaml). Outside Actions there is
  # no $GITHUB_OUTPUT, and /dev/null takes the lines a human does not need.
  released: |
    echo "cli-released=true" >> "${GITHUB_OUTPUT:-/dev/null}"
    echo "cli-version=$DISPAT_NEW_VERSION" >> "${GITHUB_OUTPUT:-/dev/null}"
    echo "released dispat $DISPAT_NEW_VERSION"
# onFail is the net for the paths the build script never finishes:
# unlink is idempotent, so closing an already-closed bracket is a
# no-op. It matters because beforePublish runs `dispat commit`, which
# stages services/dispat — a link still in place there would be
# published as a go.mod no consumer can resolve.
flow:
  build: release-build
  test: smoke
  postPublish: released
  onFail: unlink

# Package-specific release footer. A nearer footer replaces the shared list,
# so repeat the common separator before the CLI installation instructions.
github:
  footer:
    - line: ["---", ""]
    - line:
        - "**Install this version:**"
        - ""
        - "```sh"
        - "# Linux and macOS"
        - "curl -fsSL https://raw.githubusercontent.com/yohimik/dispat/v${DISPAT_NEW_VERSION}/install.sh | DISPAT_VERSION=${DISPAT_NEW_VERSION} sh"
        - "```"
        - ""
        - "```sh"
        - "# ...or with wget"
        - "wget -qO- https://raw.githubusercontent.com/yohimik/dispat/v${DISPAT_NEW_VERSION}/install.sh | DISPAT_VERSION=${DISPAT_NEW_VERSION} sh"
        - "```"
        - ""
        - "```powershell"
        - "# Windows, in PowerShell"
        - "irm https://raw.githubusercontent.com/yohimik/dispat/v${DISPAT_NEW_VERSION}/install.ps1 -OutFile install.ps1; ./install.ps1 -Version ${DISPAT_NEW_VERSION}"
        - "```"
        - ""
        - "[Documentation](https://dispat.dev/) · [dispat in CI](https://dispat.dev/reference/ci/) · [Container images](https://hub.docker.com/u/yohimik)"
