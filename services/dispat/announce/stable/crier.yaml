# The card dispat posts about a stable release.
#
# The announce script in services/dispat/dispat.yaml is one crier command whose
# configuration is named by the channel, so a stable release lands here and a
# release candidate in rc/crier.yaml. `DISPAT_NEW_VERSION=1.11.0
# DISPAT_FIXES="a fix" crier render --config
# services/dispat/announce/stable/crier.yaml` renders it without posting.
#
# One image post per platform: a cover followed by changelog pages.
render:
  # The release's face: the candidate's card seen as print. A radial pine wash
  # with the light in one corner, a thin frame ruled around the page, and the
  # section labels set as filled tags. It shares every load-bearing rule with
  # the candidate's card (the page geometry, the margin boxes that carry the
  # version badge and the page counter, the wrapping of a changelog entry) and
  # differs in how it looks. The accents vary with the run's seed, and one run
  # renders once, so every destination receives the same design.
  template: template.html
  # A stable release announces what dispat generated for it, and dispat hands
  # that to every stage as environment variables: DISPAT_NEW_VERSION and the
  # release-notes groups, one entry per line. This prefix turns them into
  # {{ .new_version }}, {{ .breaking_changes }}, {{ .features }}, {{ .fixes }}
  # and {{ .dependencies }} for the card and the caption alike, so nothing has
  # to build a document first.
  data: "env:DISPAT_"
  width: 1080
  height: 1080
  background: "#101713"
  format: jpeg
  # Instagram will not fetch a PNG, and the card is flat colour, so quality
  # costs little.
  jpeg-quality: 92
  # Only the fonts the two channels share: a release must not render differently
  # because a runner has different fonts installed than a laptop. Poppins and
  # Space Mono live under services/dispat/announce/fonts with their OFL
  # licences, one folder up, which is why the base URL points there.
  hermetic-fonts: true
  base-url: ..
  # The card paginates: page one is the cover, and a long changelog carries on
  # across the pages after it. Ten is the default and it is stated here because
  # it is load-bearing for this card: a release past it fails the render rather
  # than posting a truncated version of itself.
  pages-max: 10
  video:
    # Only the cover-story render enables video. Photo posts remain stills.
    enabled: false
    # The release's music is the arrival: the bells-and-brass finale and the
    # grandioso strain. The chase that leads up to it belongs to the candidate.
    audio-pool:
      - anthem.mp3
      - anthem-stars-and-stripes.mp3

# The same cross-posting as the rc channel, from the one file both share.
# The caption is the stable release's own and is written beside the reference,
# which replaces that one key and leaves the destinations alone.
publish:
  $ref: ../publish.yaml
  # The notes dispat generated for this release, under a fixed introduction.
  # Keep the release link first so it survives the platform's caption limit.
  #
  # crier posts a caption whole, and Discord refuses a message over 2000
  # characters and Instagram a caption over 2200. The pictures always carry the
  # groups in full, so the text carries a group only while it is short: under
  # 330 characters each, the four of them and everything fixed here stay inside
  # Instagram's limit. Discord leaves the groups to the pictures attached to
  # the same message.
  caption: |-
    {{ if eq .Platform "discord" }}@everyone {{ end }}dispat v{{ .new_version }} is out.
    Release notes: https://github.com/yohimik/dispat/releases/tag/services/dispat/v{{ .new_version }}

    Turn conventional commits into a release plan, then build and publish the changed packages in dependency order.

    dispat coordinates releases across Go, npm, Cargo, Python, Docker, mobile, game, and other supported project formats while your own commands build and publish the artifacts. Git-backed release records let interrupted runs preserve completed publications and continue the remaining work.

    Preview the plan safely with `dispat status`, then follow the guide at https://dispat.dev/
    {{ if eq .Platform "discord" }}
    What changed is on the pictures.{{ else }}{{ if .breaking_changes }}
    BREAKING:
    {{ if lt (len .breaking_changes) 330 }}{{ .breaking_changes }}{{ else }}see the pictures{{ end }}{{ end }}{{ if .features }}
    FEATURES:
    {{ if lt (len .features) 330 }}{{ .features }}{{ else }}see the pictures{{ end }}{{ end }}{{ if .fixes }}
    FIXES:
    {{ if lt (len .fixes) 330 }}{{ .fixes }}{{ else }}see the pictures{{ end }}{{ end }}{{ if .dependencies }}
    PICKS UP:
    {{ if lt (len .dependencies) 330 }}{{ .dependencies }}{{ else }}see the pictures{{ end }}{{ end }}{{ end }}

    Get started: https://dispat.dev

    #golang #opensource #devtools #releaseengineering
