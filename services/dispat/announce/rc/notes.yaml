# What this release candidate says, written by a person: the headline, every
# link to this candidate, then the notes. rc/crier.yaml pulls this file in as
# its caption, so a new candidate is announced by editing this file and the
# same words on template.html, and never the configuration.
#
# The only value it takes from the release is {{ .new_version }}. The links come
# first so they survive a platform's caption limit. Discord refuses a message
# over 2000 characters and Instagram a caption over 2200, and crier posts a
# caption whole, so Discord gets the links and the lede and leaves the long
# paragraphs to the pictures attached to the same message, which carry them in
# full. `crier publish --dry-run --json` prints each platform's caption, which
# is how to check a rewrite against those limits.
--- |-
  {{ if eq .Platform "discord" }}@everyone {{ end }}dispat v{{ .new_version }} is ready for testing.
  This release candidate: https://github.com/yohimik/dispat/releases/tag/services/dispat/v{{ .new_version }}
  Worker nodes guide: https://dispat.dev/next/distributed-execution/
  Linked repositories guide: https://dispat.dev/next/choreographed-repositories/
  Report a problem: https://github.com/yohimik/dispat/issues

  Worker nodes. One release, builds on several machines.
  {{ if eq .Platform "discord" }}
  The full notes are on the pictures.{{ else }}
  A release can run its build commands on other machines. The machine it started on keeps the release locks, the plan, every authorization and every record.

  The transport is Git alone. An orchestrator pushes an assignment to a mailbox repository and a worker polls it, so no worker needs an inbound network address. Run `dispat worker` on each machine.

  Declared build outputs travel between dependent packages, verified before they are installed, so a consumer reads the folder its provider built without committing it.

  Publishing stays on the orchestrator unless a package asks otherwise, and a space with a login script always publishes there, so credentials stay on one machine.

  Adding machines widens what can affect a release. Read the security section: a mailbox holds source and command text, and machines sharing one signing secret are one trust zone.

  With no `execution` object, a release runs exactly as it always did.

  Linked repositories are unchanged: orchestrate from one repository, or release from any of them, with no control repository.

  If a library releases but an app using it fails, the successful release stays recorded. The next run finishes what remains rather than releasing the library again.

  The other direction works too. If an app has changes of its own it releases even when the library it uses failed, and its manifests name the version the library actually published. When the library publishes later, the app is released again to pick it up.

  Known departure in this candidate: that catch-up happens only when the app is in the run where the library publishes. A library published in a run the app sat out leaves the app on the old version until the app changes; the specification's owed windows and E201 close this in the next candidate.

  Autistic stability for ADHD projects. Mathematical planning. Saga recovery.

  Check the plan with `dispat status`. It publishes nothing and takes no release locks.{{ end }}

