# One peer node in a distributed release. Start it with:
#   dispat choreographer --config dispat.example.choreographer.yaml
#
# The first node is the orchestrator. It also executes ordinary tasks and is
# the only node that advances canonical task, ledger and release refs,
# publishes artifacts and writes release records. This worker reads exact
# pinned inputs, creates its own pending/output/failed Git branches, and sends
# authenticated claim and result requests through the non-Git return channel.
# Protect canonical and release refs from its Git credential at the host. Keep
# publication credentials off this node. Supply the shared signing secret
# through the named environment variable, never in this file.

execution:
  # Match this identity to one entry of the orchestrator's
  # execution.choreographers list.
  name: build-a
  # Git access to read pinned inputs and create this worker's pickup branches.
  # With no endpoint, start this node in the repository checkout so
  # dispat can resolve its release remote.
  endpoint: git@github.com:acme/project.git
  secretEnv: DISPAT_EXECUTION_SECRET
  # Local simultaneous task limit, counted across runs.
  concurrency: 2
  transfer:
    maxFiles: 20000
    maxBytes: 2147483648
    maxManifestBytes: 8388608
    maxPackBytes: 4294967296
    timeout: 1800

logLevel: info
logFormat: json
