# The services space. This file is the space's own configuration; the dispat
# package's exceptions live in services/dispat/dispat.yaml.
tagFormat: services/{name}/v{version}
isBuildWaitingPublish: true
autoVersion:
  enabled: true
  syncLock: [go-mod-tidy]
# See the pkg space's vet: the lint gate's sweep, defined per Go space.
scripts:
  vet: go vet ./...
flow:
  beforePublish: [changelog, commit, github]
