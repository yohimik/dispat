# The services space. This file is the space's own configuration; the dispat
# package's exceptions live in services/dispat/dispat.yaml.
tagFormat: services/{name}/v{version}
isBuildWaitingPublish: true
autoVersion:
  enabled: true
  syncLock: [go-mod-tidy]
# See the pkg space's vet: the lint gate's sweep, defined per Go space, as a
# build of the shared Dockerfile.gotest so the job needs Docker and nothing
# else.
scripts:
  vet: >-
    docker buildx build --file ../../Dockerfile.gotest --target vet-$DISPAT_PACKAGE
    $(sh ../../scripts/buildx-cache.sh vet-$DISPAT_PACKAGE)
    --output type=cacheonly ../..
# The CLI's publish is its records: changelog, the leg's commit with the tag
# pushed (go.mod already pinning the pkg/* tags the earlier legs pushed), and
# the GitHub release with the binaries attached — created here, mid-run,
# because the image builds that follow install exactly that release. The steps
# run wired to the run's DISPAT_* environment; finalize finds all of it done.
#
# beforeBuild is the post-version gate, ahead of the containerised binary
# build: the unit suite against the module as this run rewrote it, resolving
# the pkg/* tags the earlier legs pushed, with no workspace and no link
# bracket — the published-module reading the bracketed build deliberately
# does not take. The script lives in services/dispat/dispat.yaml.
flow:
  publish: [changelog, commit, github]
  beforeBuild: [tests:release]
