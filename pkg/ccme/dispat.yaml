# The CCME parser and specification share major and minor versions.
# Each package retains its own patch version and tag.
versionGroup: ccme

github:
  footer:
    - line: ["---", ""]
    - line:
        - "[pkg.go.dev](https://pkg.go.dev/github.com/yohimik/dispat/pkg/ccme) · [Documentation](https://dispat.dev/)"
