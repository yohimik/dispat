# The pkg space: the five published Go libraries. This file is the space's own
# configuration; the space itself, and its path, are declared at the root.
tagFormat: pkg/{name}/v{version}
isBuildWaitingPublish: true
autoVersion:
  enabled: true
  syncLock: [go-mod-tidy]
# The libraries publish as source, so they have no build stage of their
# own. `build` still exists because the CI gate sweeps one name across the
# whole monorepo: compiling is what building a Go library means here.
scripts:
  build: go build ./...
  # The lint gate sweeps one name across the monorepo (`dispat run vet --since
  # all`), so each Go space defines what vetting means for its modules and the
  # workflow never has to enumerate them.
  vet: go vet ./...
  # Through `testreport test` so the run leaves a machine-readable log beside
  # its coverage profile: the documentation site's coverage and test-results
  # pages are built from the pair, rather than from numbers typed by hand.
  # The log is named after the package, as the profile already is.
  tests: >-
    go run github.com/yohimik/dispat/tools/testreport test "$DISPAT_PACKAGE" --
    ./... -count=1 -timeout 10m -covermode=atomic -coverprofile=../../coverage/$DISPAT_PACKAGE.out
flow:
  beforePublish: [changelog, commit]
packages:
  manifest:
    versionGroup: manifests
  scanner:
    versionGroup: manifests
    dependencies: [manifest]
  writer:
    versionGroup: manifests
    dependencies: [manifest]
  models:
    versionGroup: cli
    dependencies: [ccme]
