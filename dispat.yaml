# The monorepo's shared configuration: what every space needs, and nothing any
# one of them owns. Each space carries its own dispat.yaml in its folder, and
# the two packages with exceptions of their own (packages/docs and
# services/dispat) carry a package file beside their code — see
# https://yohimik.github.io/dispat/docs/examples/layout.
scripts:
  go-mod-tidy: go mod tidy
  pnpm-install: pnpm install
  changelog: dispat changelog
  commit: dispat commit --tag --push
  github: dispat github

  # postAll fires for every release, including one run by hand. Outside Actions
  # there is no $GITHUB_OUTPUT to write, and a guard that finds nothing to do
  # exits 0 — hence no --else.
  post-release: dispat if GITHUB_OUTPUT --then 'dispat exec post-release-outputs'
  # What the release did, as step outputs for the job that verifies the
  # composite action afterwards.
  #
  # The dispat package and nothing else: a run that publishes only the docs or
  # an image is ordinary, and in that run there is no new CLI to install, no
  # v{version} alias tag to check out and no GitHub release carrying binaries,
  # so the job that consumes these must skip rather than test the version that
  # was already out. Asking the status is enough on its own — the
  # DISPAT_RESULT_* block exists only for a package the run had a result for,
  # so it is unset when dispat was never planned, and it reads "failed" or
  # "skipped" rather than "published" when it did not make it.
  post-release-outputs: >-
    dispat if 'DISPAT_RESULT_DISPAT_STATUS=published'
    --then 'echo "cli-released=true" >> "$GITHUB_OUTPUT";
            echo "cli-version=$DISPAT_RESULT_DISPAT_NEW_VERSION" >> "$GITHUB_OUTPUT";
            echo "released dispat $DISPAT_RESULT_DISPAT_NEW_VERSION"'
    --else 'echo "cli-released=false" >> "$GITHUB_OUTPUT";
            echo "the dispat CLI did not publish in this run"'

# Fired once, after the whole task graph. It reports what the run did to the
# job that follows it; see post-release-outputs above.
run:
  postAll: post-release

versionGroups:
  manifests:
    versioning: fixed
  cli:
    versioning: fixedMajorMinor

# A space's existence and its path live here; everything else it says about
# itself lives in <space>/dispat.yaml.
spaces:
  pkg:
    path: pkg
  packages:
    path: packages
  services:
    path: services
  docker:
    path: docker

concurrency: [0, 1]

changelog:
  enabled: true

commit:
  enabled: true
  push: true
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com

github:
  enabled: true
  allPackages: true
