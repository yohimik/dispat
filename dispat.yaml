# The monorepo's shared configuration: what every space needs, and nothing any
# one of them owns. Each space carries its own dispat.yaml in its folder, and
# the two packages with exceptions of their own (packages/docs and
# services/dispat) carry a package file beside their code — see
# https://yohimik.github.io/dispat/docs/examples/layout.
scripts:
  go-mod-tidy: go mod tidy
  pnpm-install: pnpm install
  changelog: dispat changelog
  commit: dispat commit --tag --push
  github: dispat github

  # The release workflow's own stages, as dispat scripts rather than workflow
  # bash, so the release logic lives here and the workflow stays plumbing.
  # Only a `--since all` suite run leaves the complete profile set the badge
  # is a number about, which is why the release workflow is their one caller.
  coverage-badge: sh scripts/coverage-badge.sh
  test-report: go run github.com/yohimik/dispat/tools/testreport build -commit "$GITHUB_SHA"

  # Publish the coverage badge: force-push coverage/coverage.json to an orphan
  # badges branch, a single commit with no history, the same mechanism
  # deploy-docs uses for the site. README reads the file through the shields.io
  # endpoint URL. The `dispat if` guard keeps it inside CI: a release run is
  # the only context in which the push is a record rather than an accident.
  push-badge: |
    set -eu
    dispat if 'CI!=true' --then 'echo "refusing to push the badge outside CI (set CI=true to override)" >&2; exit 1'
    : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to push the badges branch}"
    : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required to push the badges branch}"
    rm -rf badge && mkdir badge && cp coverage/coverage.json badge/
    cd badge
    git init -q -b badges
    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"
    git add coverage.json
    git commit -qm "chore: update coverage badge"
    git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
    echo "pushed the coverage badge to the badges branch"

  # Build the CI bootstrap driver bin/dispat (linux/amd64) inside Docker, so a
  # Go toolchain on the runner stays a concern of the jobs that test Go. Run
  # and commit the result whenever the config or the workflows start using a
  # driver feature newer than the committed binary; a stale driver fails
  # loudly (an unknown config key or flag), never silently.
  #
  # TEMPORARY until 1.0.0: once a stable release exists, the workflows install
  # dispat through the composite action instead, and bin/dispat and this
  # script are deleted.
  #
  # The whole repository is the build context so go.work is in effect and the
  # pkg/* modules resolve from the tree. Keep the image in sync with
  # GO_VERSION in services/dispat/Dockerfile. Built to a temporary name and
  # renamed because the dispat driving this script may be bin/dispat itself,
  # and overwriting a running binary in place fails with ETXTBSY on Linux;
  # a rename swaps the directory entry and leaves the running inode alone.
  refresh-bootstrap:
    - >-
      docker run --rm -v "$PWD":/src -w /src golang:1.26
      env GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOFLAGS=-buildvcs=false
      go build -C services/dispat -o /src/bin/dispat.new .
    - mv bin/dispat.new bin/dispat

  # postAll fires for every release, including one run by hand. Outside Actions
  # there is no $GITHUB_OUTPUT to write, and a guard that finds nothing to do
  # exits 0 — hence no --else.
  post-release: dispat if GITHUB_OUTPUT --then 'dispat exec post-release-outputs'
  # What the release did, as step outputs for the job that verifies the
  # composite action afterwards.
  #
  # The dispat package and nothing else: a run that publishes only the docs or
  # an image is ordinary, and in that run there is no new CLI to install, no
  # v{version} alias tag to check out and no GitHub release carrying binaries,
  # so the job that consumes these must skip rather than test the version that
  # was already out. Asking the status is enough on its own — the
  # DISPAT_RESULT_* block exists only for a package the run had a result for,
  # so it is unset when dispat was never planned, and it reads "failed" or
  # "skipped" rather than "published" when it did not make it.
  #
  # Each argument sits on one line of its own: a `>-` fold keeps the newlines
  # of any deeper-indented continuation, which would put `--else` on a shell
  # line of its own and break the branch.
  post-release-outputs: >-
    dispat if 'DISPAT_RESULT_DISPAT_STATUS=published'
    --then 'echo "cli-released=true" >> "$GITHUB_OUTPUT"; echo "cli-version=$DISPAT_RESULT_DISPAT_NEW_VERSION" >> "$GITHUB_OUTPUT"; echo "released dispat $DISPAT_RESULT_DISPAT_NEW_VERSION"'
    --else 'echo "cli-released=false" >> "$GITHUB_OUTPUT"; echo "the dispat CLI did not publish in this run"'

# Fired once, after the whole task graph. It reports what the run did to the
# job that follows it; see post-release-outputs above.
run:
  postAll: post-release

versionGroups:
  manifests:
    versioning: fixed
  cli:
    versioning: fixedMajorMinor

# A space's existence and its path live here; everything else it says about
# itself lives in <space>/dispat.yaml.
spaces:
  pkg:
    path: pkg
  packages:
    path: packages
  services:
    path: services
  docker:
    path: docker

concurrency: [0, 1]

changelog:
  enabled: true

commit:
  enabled: true
  push: true
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com

github:
  enabled: true
  allPackages: true
