# The monorepo's shared configuration: what every space needs, and nothing any
# one of them owns. Each space carries its own dispat.yaml in its folder, and
# the packages with exceptions of their own (packages/docs, services/dispat
# and infra) carry a package file beside their code — see
# https://dispat.dev/examples/layout/.
scripts:
  # The lock syncs run as builds of the shared Dockerfiles and export the
  # regenerated files back over the working tree's, so neither needs a host
  # toolchain. Package scripts run inside the releasing package's folder,
  # which is why the repository root and the module's path under it are read
  # from git rather than assumed.
  go-mod-tidy: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    MODULE=$(git rev-parse --show-prefix); MODULE=${MODULE%/}
    docker buildx build --file "$ROOT/Dockerfile.gotest" --target tidy-export \
      --build-arg MODULE="$MODULE" \
      $(sh "$ROOT/scripts/buildx-cache.sh" "tidy-$DISPAT_PACKAGE") \
      --output type=local,dest=. "$ROOT"
  pnpm-install: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    docker buildx build --file "$ROOT/packages/docs/Dockerfile" --target lockfile-export \
      $(sh "$ROOT/scripts/buildx-cache.sh" docs-lockfile) \
      --output "type=local,dest=$ROOT" "$ROOT"
  changelog: dispat changelog
  commit: dispat commit --tag --push
  github: dispat github

  # The format sweep the lint job runs, as a build like every other gate.
  gofmt-check: >-
    docker buildx build --file Dockerfile.gotest --target gofmt
    $(sh scripts/buildx-cache.sh gofmt) --output type=cacheonly .

  # The shell sweep beside it: every script this repository runs outside a Go
  # program, checked by shellcheck in a stage of its own. The stage is
  # self-contained (alpine, shellcheck, python3) rather than a layer on the Go
  # image, because nothing it checks needs a toolchain and a lint gate should
  # not wait on one.
  shellcheck: >-
    docker buildx build --file Dockerfile.gotest --target shellcheck
    $(sh scripts/buildx-cache.sh shellcheck) --output type=cacheonly .

  # The TinyGo spike, as a build like every other gate. Its targets never
  # abort: the logs are what it produces, so the export lands them in
  # coverage/tinygo-spike/ whatever they say, and the verdict is read from the
  # files rather than from a build's exit code.
  #
  # Not a gate, and not in any sweep: upstream TinyGo's crypto/tls is a stub
  # that puts plaintext on the wire, and https is every release path dispat
  # has, so nothing is built with it. The script stays because the answer is
  # a version number away from changing and re-asking must cost one command,
  # and the fork stages are that re-asking: they fetch github.com/yohimik/tinygo
  # and run dispat's own self-update against a fake release server over real
  # TLS.
  # See the header of Dockerfile.tinygo for what the spike found and what the
  # fork changes; the answer is still read from the logs.
  tinygo-spike: >-
    docker buildx build --file Dockerfile.tinygo --target tinygo-spike-export
    $(sh scripts/buildx-cache.sh tinygo-spike)
    --output type=local,dest=coverage/tinygo-spike .

  # The gcloud+terraform image the deployment stages `docker run`: the one
  # image a release materialises (see infra/tools.Dockerfile for why those
  # stages cannot be build targets). Layer-cached, so the second caller in a
  # run pays nothing. The callers are package scripts, so `dispat exec` runs
  # this in their folders; the repository root is read from git rather than
  # assumed, exactly as go-mod-tidy does.
  tools-image: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    docker buildx build --load --tag dispat-release-tools \
      --file "$ROOT/infra/tools.Dockerfile" \
      $(sh "$ROOT/scripts/buildx-cache.sh" release-tools) \
      "$ROOT/infra"

  # The release workflow's own stages, as dispat scripts rather than workflow
  # bash, so the release logic lives here and the workflow stays plumbing.
  # Only a `--since all` suite run leaves the complete profile set the badge
  # is a number about, which is why the release workflow is their one caller.
  # Both are builds of Dockerfile.gotest over the profiles in coverage/; the
  # badge target writes its summary table to coverage/summary.md because a
  # build cannot reach $GITHUB_STEP_SUMMARY, so the append happens here.
  coverage-badge:
    - >-
      docker buildx build --file Dockerfile.gotest --target badge-export
      $(sh scripts/buildx-cache.sh badge) --output type=local,dest=coverage .
    - cat coverage/summary.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
  # The host-side report, from the profiles and logs in coverage/: what a
  # `dispat run tests --since all` on this machine leaves behind, rendered as
  # the site reads it. The release builds its own from the stages themselves
  # (see the docs package's test-report hook), because a release job has no
  # coverage/ folder to point at.
  test-report: >-
    docker buildx build --file Dockerfile.gotest --target report-export
    --build-arg COMMIT="${GITHUB_SHA:-$(git rev-parse HEAD)}"
    $(sh scripts/buildx-cache.sh report) --output type=local,dest=packages/docs/data .

  # Publish the coverage badge: force-push coverage/coverage.json to an orphan
  # badges branch, a single commit with no history, the same mechanism
  # deploy-docs uses for the site. README reads the file through the shields.io
  # endpoint URL. The `dispat if` guard keeps it inside CI: a release run is
  # the only context in which the push is a record rather than an accident.
  push-badge: |
    set -eu
    dispat if 'CI!=true' --then 'echo "refusing to push the badge outside CI (set CI=true to override)" >&2; exit 1'
    : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to push the badges branch}"
    : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required to push the badges branch}"
    rm -rf badge && mkdir badge && cp coverage/coverage.json badge/
    cd badge
    git init -q -b badges
    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"
    git add coverage.json
    git commit -qm "chore: update coverage badge"
    git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
    echo "pushed the coverage badge to the badges branch"

versionGroups:
  manifests:
    versioning: fixed
  cli:
    versioning: fixedMajorMinor

# A space's existence and its path live here; everything else it says about
# itself lives in <space>/dispat.yaml.
spaces:
  pkg:
    path: pkg
  packages:
    path: packages
  services:
    path: services
  docker:
    path: docker

# The workspace folders that are repository tooling rather than something
# dispat ships: never versioned, never tagged, never published — but swept by
# `dispat run vet`, `tests` and `build` like every real package, so the lint
# and test gates need no hand-kept module list beside the sweep.
packages:
  tools:
    path: tools
    versioning: none
    # One folder deep rather than a space's two, hence the shorter relative
    # paths. vet doubles as the build gate: it compiles what it analyses,
    # and a compile gate must leave no artifact in the checkout, which a
    # cacheonly build never does.
    scripts:
      vet: >-
        docker buildx build --file ../Dockerfile.gotest --target vet-tools
        $(sh ../scripts/buildx-cache.sh vet-tools) --output type=cacheonly ..
      build: >-
        docker buildx build --file ../Dockerfile.gotest --target vet-tools
        $(sh ../scripts/buildx-cache.sh vet-tools) --output type=cacheonly ..
      # Through `testreport test` (inside the target) like every Go suite, so
      # the repository tooling's own runs land in the site's test-results
      # page too.
      tests: >-
        docker buildx build --file ../Dockerfile.gotest --target export-tools
        $(sh ../scripts/buildx-cache.sh gotest-tools)
        --output type=local,dest=../coverage ..
  integration:
    path: tests/integration
    versioning: none
    # The module requires models and drives the CLI. Owning its test script
    # makes an integration-only change a real gate; the dispat dependency
    # makes --consumers select it after a CLI change, exactly once.
    dependencies: [models, dispat]
    scripts:
      vet: >-
        docker buildx build --file ../../Dockerfile.gotest --target vet-integration
        $(sh ../../scripts/buildx-cache.sh vet-integration) --output type=cacheonly ../..
      build: >-
        docker buildx build --file ../../Dockerfile.gotest --target vet-integration
        $(sh ../../scripts/buildx-cache.sh vet-integration) --output type=cacheonly ../..
      tests: >-
        docker buildx build --file ../../Dockerfile.gotest --target export-integration
        $(sh ../../scripts/buildx-cache.sh gotest-integration)
        --output type=local,dest=../../coverage ../..
  # The release experiments (tests/experiments): the image a release just
  # published, put through the faults a unit test never reaches, beside
  # lerna, nx and changesets in the same fixture. Script-only like tools:
  # never versioned, never tagged, never published. `build` is what the
  # build gate reaches when the folder changes; the docs package's
  # beforeBuild hook runs `experiments` and `summary` inside every release,
  # and the Experiments workflow runs the same scripts by hand.
  #
  # The records land in the repository's coverage/ folder beside the test
  # profiles, never under tests/experiments: a run is reproduced rather than
  # kept, and what a release measured travels to the site through the report
  # rather than through the checkout.
  experiments:
    path: tests/experiments
    versioning: none
    scripts:
      # The version under test is the one the caller names, else the newest
      # published image: an experiment runs the bytes a release shipped,
      # never a build of the checkout, so a planned version nobody published
      # is never a candidate, and the prerelease tags are not either.
      build: |
        set -eu
        version=${EXPERIMENTS_DISPAT_VERSION:-$(git tag -l 'docker/dispat-alpine/v*' --sort=-v:refname | sed 's|.*/v||; /-/d' | head -n 1)}
        : "${version:?no published dispat-alpine image to build the experiments on}"
        echo "building the experiments on yohimik/dispat-alpine:$version"
        docker buildx build --file Dockerfile --build-arg "DISPAT_VERSION=$version" \
          $(sh ../../scripts/buildx-cache.sh experiments) --load --tag dispat-experiments .
      # One cell, named the way run.sh takes it: EXPERIMENT and TOOL, and
      # SCENARIO where the experiment has more than one. The image is assumed
      # built, so a sweep pays for it once; `experiment` below is the form
      # that builds first.
      #
      # The console goes to <cell>.log rather than to the terminal, because
      # twelve of these run at once and interleaved transcripts are a record
      # of nothing. The exit code is the harness verdict: the cell's own file
      # says what happened, and the caller only needs to know whether it held.
      cell: |
        set -eu
        : "${EXPERIMENT:?EXPERIMENT is required (orphan, midrelease)}"
        : "${TOOL:?TOOL is required (lerna, nx, changesets, dispat)}"
        ROOT=$(git rev-parse --show-toplevel)
        RESULTS=${EXPERIMENTS_RESULTS:-$ROOT/coverage/experiments}
        cell=$EXPERIMENT${SCENARIO:+-$SCENARIO}-$TOOL
        mkdir -p "$RESULTS"
        rc=0
        docker run --rm -v "$RESULTS:/results" \
          -e "EXPECT=${EXPERIMENTS_EXPECT:-1}" \
          dispat-experiments "$EXPERIMENT" "$TOOL" ${SCENARIO:-} > "$RESULTS/$cell.log" 2>&1 || rc=$?
        echo "$cell: exit $rc"
        exit "$rc"
      # One cell, built first: the by-hand form, for re-recording a single
      # protocol without paying for the other eleven.
      experiment: |
        set -eu
        dispat exec build --for pkg:experiments --in pkg:experiments
        dispat exec cell --for pkg:experiments --in pkg:experiments
      # The campaign, as lines: one cell per line, `<experiment> <tool>` and a
      # scenario where the experiment has more than one, which is the argument
      # order `cell` and run.sh take.
      #
      # This is the only place the twelve are enumerated. The sweep below pipes
      # it into xargs and the Experiments workflow turns it into its matrix, so
      # a cell added here is a cell both runs, and neither can drift into
      # measuring a different campaign than the other.
      cells: |
        set -eu
        for tool in dispat lerna nx changesets; do
          echo "orphan $tool"
        done
        for scenario in clean conflict; do
          for tool in dispat lerna nx changesets; do
            echo "midrelease $tool $scenario"
          done
        done
      # Every cell of the campaign, four at a time. The folder is wiped
      # through the image rather than by the host's rm, because the container
      # writes it as root and a host rm of root-owned files needs a password
      # nobody has in CI.
      #
      # xargs runs each cell and remembers whether any exited non-zero (123),
      # so a release fails on a dispat cell whose expectations did not hold
      # while every other cell still gets its record.
      experiments: |
        set -eu
        ROOT=$(git rev-parse --show-toplevel)
        RESULTS=${EXPERIMENTS_RESULTS:-$ROOT/coverage/experiments}
        dispat exec build --for pkg:experiments --in pkg:experiments
        mkdir -p "$RESULTS"
        docker run --rm -v "$RESULTS:/results" --entrypoint find dispat-experiments \
          /results -mindepth 1 -delete
        echo "running twelve cells, ${EXPERIMENTS_JOBS:-4} at a time, into $RESULTS"
        dispat exec cells --for pkg:experiments --in pkg:experiments \
        | EXPERIMENTS_RESULTS="$RESULTS" xargs -P "${EXPERIMENTS_JOBS:-4}" -L 1 sh -c \
            'EXPERIMENT=$0 TOOL=$1 SCENARIO=${2:-} dispat exec cell --for pkg:experiments --in pkg:experiments'
      # The table over whatever the cells recorded, through the same verb the
      # site's report reads them with, so a job summary and the published page
      # are one renderer over one set of records.
      #
      # A build of Dockerfile.gotest like every other gate, which means it
      # reads the repository's own coverage/experiments through the build
      # context: EXPERIMENTS_RESULTS moves where the cells write, and a
      # summary of a folder outside the checkout is a `testreport experiments`
      # away rather than this script's business.
      summary: |
        set -eu
        ROOT=$(git rev-parse --show-toplevel)
        docker buildx build --file "$ROOT/Dockerfile.gotest" --target experiments-summary-export \
          $(sh "$ROOT/scripts/buildx-cache.sh" experiments-summary) \
          --output "type=local,dest=$ROOT/coverage" "$ROOT"
        cat "$ROOT/coverage/experiments.md"
        # The heading is the step summary's alone: a terminal already knows
        # what it just asked for, and a summary page is a wall of other
        # sections.
        {
          echo "### Release experiments"
          echo
          cat "$ROOT/coverage/experiments.md"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
  # The Google Cloud footprint that serves dispat.dev, released like code.
  # Only the existence and the folder live here; everything the package says
  # about itself lives in infra/dispat.yaml, beside the Terraform it
  # configures.
  infra:
    path: infra

# The version of the dispat CLI its in-repo consumers take: the docker images
# hand it to install.sh, and anything else that needs the CLI's version reads
# the same name instead of deriving its own. It defaults to the version dispat
# carries at the end of the current run — the planned version when dispat is
# releasing, which is right because the images build only after it publishes,
# and its released baseline otherwise, so a docs- or image-only release
# installs the CLI that is actually out. The docker build gate overrides it
# for the one case the default cannot cover (a planned version nobody
# published yet); see the build script in docker/dispat.yaml.
env:
  INSTALL_DISPAT_VERSION: ${DISPAT_WORKSPACE_DISPAT_VERSION}

concurrency: [0, 1]

# What every record says beside the notes themselves, stated once for each
# destination because the two are separate policies rather than one with two
# outputs. The changelog file borrows this block's github coordinates for its
# links, so `auto` resolves to the same repository in both.
#
# `authors: both` credits each line inline and lists the people once under the
# sections; the exclusion drops the release bot, whose commits are the run's own
# bookkeeping rather than anybody's work. The glob has no character classes, so
# `*[bot]` is the literal suffix github-actions[bot] carries.
#
# `dependencyLink` and `commitRefs` make the entries navigable: a provider line
# reaches that provider's release page, and every entry line reaches the commit
# it was written in. Both derive their URLs from this repository rather than
# from a template, and both fall back to plain text rather than to a link that
# leads nowhere.
changelog:
  enabled: true
  authors:
    placement: both
    exclude: ["*[bot]"]
  dependencyLink: auto
  commitRefs:
    placement: suffix
    link: auto

commit:
  enabled: true
  push: true
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com

github:
  enabled: true
  allPackages: true
  # The same three settings the changelog block carries, restated because a
  # destination inherits nothing from the other one: a release body credits its
  # authors, links each provider to its release, and points every line at the
  # commit behind it.
  authors:
    placement: both
    exclude: ["*[bot]"]
  dependencyLink: auto
  commitRefs:
    placement: suffix
    link: auto
  # Every release body closes with where what shipped can be fetched and read,
  # under the change sections: the page is about what changed, and the way to
  # install it is the next thing you want rather than the first. The rule leads
  # the block so the sections above it end cleanly. The lines interpolate the
  # releasing package's own DISPAT_* variables, and the package/space filters
  # write each block only for the releases it is about. The installer is
  # fetched from this release's own v{version} alias tag, so a prerelease
  # installs with the installer it shipped with.
  #
  # The rule is also what `dispat self-update` cuts on when it prints a
  # release's notes to a terminal, so everything below it stays out of the
  # summary a user reads after an update.
  footer:
    - line:
        - "---"
        - ""
    - package: [dispat]
      # The same three install variants the README offers, pinned to this
      # release's own installer via its v{version} alias tag. The PowerShell
      # line passes -Version rather than setting $env:DISPAT_VERSION, because
      # these lines run through the ${VAR} expansion and a literal $env would
      # be read as a variable named "env".
      line:
        - "**Install this version:**"
        - ""
        - "```sh"
        - "# Linux and macOS"
        - "curl -fsSL https://raw.githubusercontent.com/yohimik/dispat/v${DISPAT_NEW_VERSION}/install.sh | DISPAT_VERSION=${DISPAT_NEW_VERSION} sh"
        - "```"
        - ""
        - "```sh"
        - "# ...or with wget"
        - "wget -qO- https://raw.githubusercontent.com/yohimik/dispat/v${DISPAT_NEW_VERSION}/install.sh | DISPAT_VERSION=${DISPAT_NEW_VERSION} sh"
        - "```"
        - ""
        - "```powershell"
        - "# Windows, in PowerShell"
        - "irm https://raw.githubusercontent.com/yohimik/dispat/v${DISPAT_NEW_VERSION}/install.ps1 -OutFile install.ps1; ./install.ps1 -Version ${DISPAT_NEW_VERSION}"
        - "```"
        - ""
        - "[Documentation](https://dispat.dev/) · [dispat in CI](https://dispat.dev/reference/ci/) · [Container images](https://hub.docker.com/u/yohimik)"
    - space: [docker]
      line:
        - "`docker pull yohimik/${DISPAT_PACKAGE}:${DISPAT_NEW_VERSION}` · [Docker Hub](https://hub.docker.com/r/yohimik/${DISPAT_PACKAGE}) · [The dispat images](https://dispat.dev/reference/ci/#the-container-images)"
    - space: [pkg]
      line:
        - "[pkg.go.dev](https://pkg.go.dev/github.com/yohimik/dispat/pkg/${DISPAT_PACKAGE}@v${DISPAT_NEW_VERSION}) · [Documentation](https://dispat.dev/)"
    - package: [docs]
      line:
        - "[The documentation site](https://dispat.dev/) this release deploys."
