# The tags a stable release of dispat-debian answers to, merged over
# docker-compose.yml by the build and publish stages. See
# docker/dispat-ubuntu/stable.yml for why these live outside the manifest.
services:
  dispat:
    build:
      tags:
        - docker.io/yohimik/dispat-debian:latest
        - docker.io/yohimik/dispat-debian:stable
        - docker.io/yohimik/dispat-debian:${DISPAT_MAJOR:?}
        - docker.io/yohimik/dispat-debian:${DISPAT_MAJOR:?}.${DISPAT_MINOR:?}
