# The manifest of the dispat-alpine package, and the command that builds it. The
# moving tags live in stable.yml / rc.yml beside it, merged in by channel.
# docker/dispat-ubuntu/docker-compose.yml carries the reasoning behind the shape.
services:
  dispat:
    image: docker.io/yohimik/dispat-alpine:1.0.0
    build:
      context: ../..
      dockerfile: docker/dispat-alpine/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        DISPAT_VERSION: ${INSTALL_DISPAT_VERSION:?}
      labels:
        io.dispat.cli.version: ${INSTALL_DISPAT_VERSION:?}
