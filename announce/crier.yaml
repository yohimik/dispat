# The card dispat posts about its own releases.
#
# announce.sh drives this from dispat's announce stage; it is not a project
# anybody runs by hand, though `crier render --config announce/crier.yaml`
# with some DISPAT_* variables set is how the previews beside this file were
# made.
#
# One image post per platform: a cover followed by changelog pages.
# Cover-only mode keeps the changelog in the caption.
render:
  # Two layouts rather than one. They share every load-bearing rule (the page
  # geometry, the margin boxes that carry the version badge and the page
  # counter, the wrapping of a changelog entry) and differ in how they look: a
  # faint lattice on near-black against a radial pine wash with a framed card.
  # crier picks one per run from the run's seed, which announce.sh derives from
  # the version, so a release has a face of its own and every destination receives
  # the same design.
  #
  # A pool and render.template together would not be an error, but the pool
  # would win and the file would read as two intentions, so there is no
  # render.template here.
  pool:
    - template.html
    - template-b.html
  # The data comes from announce.sh on standard input, built out of the
  # release-notes variables. It has arrays in it, which an env: prefix cannot
  # carry: this is the case stdin exists for.
  data: "-"
  width: 1080
  height: 1080
  background: "#101713"
  format: jpeg
  # Instagram will not fetch a PNG, and the card is flat colour, so quality
  # costs little.
  jpeg-quality: 92
  # Only the fonts beside this file: a release must not render differently
  # because a runner has different fonts installed than a laptop. Poppins and
  # Space Mono live under announce/fonts with their OFL licences.
  hermetic-fonts: true
  base-url: .
  # The card paginates: page one is the cover, and a long changelog carries on
  # across the pages after it. Ten is the default and it is stated here because
  # it is load-bearing for this card: a release past it fails the render rather
  # than posting a truncated version of itself, and notes.sh's own cap of
  # twenty entries a section is what keeps a real release well under it.
  pages-max: 10
  video:
    # Only the cover-story render enables video. Photo posts remain stills.
    enabled: false
    audio-pool:
      - anthem.mp3
      - anthem-stars-and-stripes.mp3
      - anthem-william-tell.mp3
      - anthem-mountain-king.mp3

publish:
  # The same changelog appears in Instagram, LinkedIn and Discord text.
  # Keep the release link first so it survives the platform's caption limit.
  caption: |-
    dispat v{{ .version }} is out.
    Release notes: https://github.com/yohimik/dispat/releases
    {{ if .sections }}
    What changed:{{ range .sections }}
    {{ .label }}:{{ range .items }}
    - {{ . }}{{ end }}{{ if gt .more 0 }}
    - and {{ .more }} more{{ end }}{{ end }}
    {{ end }}
    Release packages across languages in dependency order.
    Get started: https://dispat.dev

    #golang #opensource #devtools #releaseengineering

  instagram:
    enabled: true
    api-base-url: https://graph.instagram.com/v25.0
    poll-timeout: 5m
    story: false
    cover-story: true
    # Ten rendered photos fit in one carousel. The script caps rendering to
    # the same number, so crier cannot split an announcement into more posts.
    max-attachments: 10

  linkedin:
    # Enabled with the other destinations in a single publishing command.
    # The shared render cap keeps every destination within one photo post.
    enabled: false
    max-attachments: 10

  discord:
    mention-everyone: true
    # Enabled with the other destinations. Incoming webhooks take
    # ten ordered files in one multipart message, and crier never retries that
    # request after an ambiguous failure.
    enabled: false
    max-attachments: 10
    caption: |-
      @everyone dispat v{{ .version }} is out.
      Release notes: https://github.com/yohimik/dispat/releases
      {{ if .sections }}
      What changed:{{ range .sections }}
      {{ .label }}:{{ range .items }}
      - {{ . }}{{ end }}{{ if gt .more 0 }}
      - and {{ .more }} more{{ end }}{{ end }}
      {{ end }}
      Release packages across languages in dependency order.
      Get started: https://dispat.dev

      #golang #opensource #devtools #releaseengineering
