# The black-box suite follows CLI changes and is never released itself.
versioning: none
dependencies: [models, dispat]
scripts:
  vet: >-
    docker buildx build --file ../../Dockerfile.gotest --target vet-integration
    $(sh ../../scripts/buildx-cache.sh vet-integration) --output type=cacheonly ../..
  build: >-
    docker buildx build --file ../../Dockerfile.gotest --target vet-integration
    $(sh ../../scripts/buildx-cache.sh vet-integration) --output type=cacheonly ../..
  tests: >-
    docker buildx build --file ../../Dockerfile.gotest --target export-integration
    $(sh ../../scripts/buildx-cache.sh gotest-integration)
    --output type=local,dest=../../coverage ../..
  test:integration: >-
    docker buildx build --file ../../Dockerfile.gotest --target export-integration-normal
    $(sh ../../scripts/buildx-cache.sh gotest-integration-normal)
    --output type=local,dest=../../coverage ../..
  test:race: >-
    docker buildx build --file ../../Dockerfile.gotest --target export-integration-race
    $(sh ../../scripts/buildx-cache.sh gotest-integration-race)
    --output type=local,dest=../../coverage ../..
