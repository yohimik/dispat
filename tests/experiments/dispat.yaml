# Release experiment harness: script-only and never released.
versioning: none
scripts:
  # The version under test is the one the caller names, else the newest
  # published image: an experiment runs the bytes a release shipped,
  # never an implicit build of the checkout. Candidate mode below requires
  # both an explicit executable and identity; automatic selection uses only
  # published stable image tags.
  build: |
    set -eu
    version=${EXPERIMENTS_DISPAT_VERSION:-$(git tag -l 'docker/dispat-alpine/v*' --sort=-v:refname | sed 's|.*/v||; /-/d' | head -n 1)}
    if [ -n "${EXPERIMENTS_DISPAT_ARTIFACT:-}" ]; then
      : "${EXPERIMENTS_DISPAT_ID:?EXPERIMENTS_DISPAT_ID is required with EXPERIMENTS_DISPAT_ARTIFACT}"
      [ -f "$EXPERIMENTS_DISPAT_ARTIFACT" ] || { echo "candidate binary not found: $EXPERIMENTS_DISPAT_ARTIFACT" >&2; exit 2; }
      candidate=$(mktemp -d)
      trap 'rm -rf "$candidate"' EXIT
      cp "$EXPERIMENTS_DISPAT_ARTIFACT" "$candidate/dispat"
      chmod +x "$candidate/dispat"
      echo "building the experiments on candidate $EXPERIMENTS_DISPAT_ID"
      docker buildx build --file Dockerfile --build-arg "DISPAT_VERSION=${version:-1.7.1}" \
        --build-arg DISPAT_BINARY_SOURCE=candidate-binary \
        --build-arg "DISPAT_BINARY_ID=$EXPERIMENTS_DISPAT_ID" \
        --build-context "candidate-binary=$candidate" \
        --build-context measurement-source=../../tools \
        $(sh ../../scripts/buildx-cache.sh experiments) --load --tag dispat-experiments .
    else
      : "${version:?no published dispat-alpine image to build the experiments on}"
      echo "building the experiments on yohimik/dispat-alpine:$version"
      docker buildx build --file Dockerfile --build-arg "DISPAT_VERSION=$version" \
        --build-arg "DISPAT_BINARY_ID=shipped:$version" \
        --build-context measurement-source=../../tools \
        $(sh ../../scripts/buildx-cache.sh experiments) --load --tag dispat-experiments .
    fi
  # One cell, named the way run.sh takes it: EXPERIMENT and TOOL, and
  # SCENARIO where the experiment has more than one. The image is assumed
  # built, so a sweep pays for it once; `experiment` below is the form
  # that builds first.
  #
  # The console goes to <cell>.log rather than to the terminal, because
  # several of these run at once and interleaved transcripts are a record
  # of nothing. The exit code is the harness verdict: the cell's own file
  # says what happened, and the caller only needs to know whether it held.
  cell: |
    set -eu
    : "${EXPERIMENT:?EXPERIMENT is required (orphan, midrelease, propagation, timing)}"
    : "${TOOL:?TOOL is required (lerna, nx, changesets, dispat)}"
    ROOT=$(git rev-parse --show-toplevel)
    RESULTS=${EXPERIMENTS_RESULTS:-$ROOT/coverage/experiments}
    cell=$EXPERIMENT${SCENARIO:+-$SCENARIO}-$TOOL
    mkdir -p "$RESULTS"
    rc=0
    docker run --rm -v "$RESULTS:/results" \
      -e "EXPECT=${EXPERIMENTS_EXPECT:-1}" \
      dispat-experiments "$EXPERIMENT" "$TOOL" ${SCENARIO:-} > "$RESULTS/$cell.log" 2>&1 || rc=$?
    echo "$cell: exit $rc"
    exit "$rc"
  # One cell, built first: the by-hand form, for re-recording a single
  # protocol without paying for the rest of the campaign.
  experiment: |
    set -eu
    dispat exec build --for pkg:experiments --in pkg:experiments
    dispat exec cell --for pkg:experiments --in pkg:experiments
  # The campaign, as lines: one cell per line, `<experiment> <tool>` and a
  # scenario where the experiment has more than one, which is the argument
  # order `cell` and run.sh take.
  #
  # This is the only place the cells are enumerated. The sweep below pipes
  # it into xargs and the cache manifest stores it, so a cell added here is
  # a cell the next campaign runs, and a reused campaign can never be one
  # that measured a different list.
  cells: |
    set -eu
    for tool in dispat lerna nx changesets; do
      echo "orphan $tool"
    done
    for scenario in clean conflict; do
      for tool in dispat lerna nx changesets; do
        echo "midrelease $tool $scenario"
      done
    done
    for scenario in build publish build-distributed deselected held deferred deferred-build; do
      for tool in dispat lerna nx changesets; do
        echo "propagation $tool $scenario"
      done
    done
    for scenario in six wide; do
      for tool in dispat lerna nx changesets; do
        echo "timing $tool $scenario"
      done
    done
  # Every cell of the campaign, four at a time, then the timing cells one at
  # a time: a timing cell measures durations, and a cell running beside it on
  # the same host would be part of what it measured. A completed campaign can be
  # reused when it names this exact native image (which includes the released
  # dispat binary, pinned tools and harness) and every expected record still
  # parses. Failed, partial and corrupt campaigns have no valid manifest and
  # are wiped through the image before being reproduced.
  #
  # xargs runs each cell and remembers whether any exited non-zero (123),
  # so a release fails on a dispat cell whose expectations did not hold
  # while every other cell still gets its record.
  experiments: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    RESULTS=${EXPERIMENTS_RESULTS:-$ROOT/coverage/experiments}
    . "$ROOT/tests/experiments/lib/cache.sh"
    dispat exec build --for pkg:experiments --in pkg:experiments
    mkdir -p "$RESULTS"
    image=$(docker image inspect --format '{{.Id}}' dispat-experiments)
    expected=$(dispat exec cells --for pkg:experiments --in pkg:experiments | awk '
      NF == 2 { print $1 "-" $2 }
      NF == 3 { print $1 "-" $3 "-" $2 }
    ' | sort)
    if experiment_cache_valid "$RESULTS" "$image" "$expected"; then
      echo "reusing $(printf '%s\n' "$expected" | sed '/^$/d' | wc -l | tr -d ' ') complete cells from the identical experiments image $image"
      exit 0
    fi
    docker run --rm -v "$RESULTS:/results" --entrypoint find dispat-experiments \
      /results -mindepth 1 -maxdepth 1 ! -name execution-measurements -exec rm -rf '{}' +
    echo "running $(printf '%s\n' "$expected" | sed '/^$/d' | wc -l | tr -d ' ') cells, ${EXPERIMENTS_JOBS:-4} at a time and the timing cells alone, into $RESULTS"
    sweep() { # <jobs>: the cells on stdin, that many at a time
      EXPERIMENTS_RESULTS="$RESULTS" xargs -P "$1" -L 1 sh -c \
        'EXPERIMENT=$0 TOOL=$1 SCENARIO=${2:-} dispat exec cell --for pkg:experiments --in pkg:experiments'
    }
    cells=$(dispat exec cells --for pkg:experiments --in pkg:experiments)
    rc=0
    printf '%s\n' "$cells" | grep -v '^timing ' | sweep "${EXPERIMENTS_JOBS:-4}" || rc=$?
    printf '%s\n' "$cells" | grep '^timing ' | sweep 1 || rc=$?
    if [ "$rc" -eq 0 ]; then
      experiment_cache_write "$RESULTS" "$image" "$expected"
    fi
    exit "$rc"
  # The table over whatever the cells recorded, through the same verb the
  # site's report reads them with, so a job summary and the published page
  # are one renderer over one set of records.
  #
  # A build of Dockerfile.gotest like every other gate, which means it
  # reads the repository's own coverage/experiments through the build
  # context: EXPERIMENTS_RESULTS moves where the cells write, and a
  # summary of a folder outside the checkout is a `testreport experiments`
  # away rather than this script's business.
  summary: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    docker buildx build --file "$ROOT/Dockerfile.gotest" --target experiments-summary-export \
      $(sh "$ROOT/scripts/buildx-cache.sh" experiments-summary) \
      --output "type=local,dest=$ROOT/coverage" "$ROOT"
    cat "$ROOT/coverage/experiments.md"
    # The heading is the step summary's alone: a terminal already knows
    # what it just asked for, and a summary page is a wall of other
    # sections.
    {
      echo "### Release experiments"
      echo
      cat "$ROOT/coverage/experiments.md"
    } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
  # The release workflow validates these selected full artifacts before any
  # release effects, then imports them after standard campaign cache cleanup.
  # Candidate version/source/hash fields are retained without relabeling.
  import-build-campaigns: |
    set -eu
    : "${EXPERIMENTS_LLVM_CAMPAIGN_DIR:?EXPERIMENTS_LLVM_CAMPAIGN_DIR is required}"
    : "${EXPERIMENTS_KERNEL_CAMPAIGN_DIR:?EXPERIMENTS_KERNEL_CAMPAIGN_DIR is required}"
    : "${EXPERIMENTS_BUILD_SOURCE_REVISION:?EXPERIMENTS_BUILD_SOURCE_REVISION is required}"
    : "${EXPERIMENTS_BUILD_BINARY_SHA256:?EXPERIMENTS_BUILD_BINARY_SHA256 is required}"
    : "${EXPERIMENTS_LLVM_RUN_ID:?EXPERIMENTS_LLVM_RUN_ID is required}"
    : "${EXPERIMENTS_LLVM_RUN_ATTEMPT:?EXPERIMENTS_LLVM_RUN_ATTEMPT is required}"
    : "${EXPERIMENTS_KERNEL_RUN_ID:?EXPERIMENTS_KERNEL_RUN_ID is required}"
    : "${EXPERIMENTS_KERNEL_RUN_ATTEMPT:?EXPERIMENTS_KERNEL_RUN_ATTEMPT is required}"
    ROOT=$(git rev-parse --show-toplevel)
    RESULTS=${EXPERIMENTS_RESULTS:-$ROOT/coverage/experiments}
    mkdir -p "$RESULTS"
    set --
    if [ "${EXPERIMENTS_BUILD_VALIDATE_ONLY:-}" = 1 ]; then
      set -- --validate-only
    fi
    docker run --rm --user "$(id -u):$(id -g)" \
      -v "$ROOT:/src:ro" -v "$EXPERIMENTS_LLVM_CAMPAIGN_DIR:/incoming/llvm:ro" \
      -v "$EXPERIMENTS_KERNEL_CAMPAIGN_DIR:/incoming/kernel:ro" -v "$RESULTS:/results" \
      -w /src/tools -e GOWORK=off -e GOCACHE=/tmp/go-build -e GOMODCACHE=/tmp/go-mod \
      golang:1.26.10 sh -euc '
        go build -trimpath -o /tmp/campaign-tools/ ./llvmexperiment ./testreport
        /tmp/campaign-tools/testreport experiments /incoming/llvm/cells > /dev/null
        /tmp/campaign-tools/testreport experiments /incoming/kernel/cells > /dev/null
        exec /tmp/campaign-tools/llvmexperiment import-campaigns "$@"
      ' import-build-campaigns \
      --llvm /incoming/llvm --kernel /incoming/kernel --results /results \
      --source "$EXPERIMENTS_BUILD_SOURCE_REVISION" --binary-sha256 "$EXPERIMENTS_BUILD_BINARY_SHA256" \
      --llvm-run "$EXPERIMENTS_LLVM_RUN_ID" --llvm-attempt "$EXPERIMENTS_LLVM_RUN_ATTEMPT" \
      --kernel-run "$EXPERIMENTS_KERNEL_RUN_ID" --kernel-attempt "$EXPERIMENTS_KERNEL_RUN_ATTEMPT" "$@"
  llvm-build: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    dispat exec build --for pkg:experiments --in pkg:experiments
    docker buildx build --file "$ROOT/tests/experiments/Dockerfile.llvm" \
      --load --tag dispat-experiments-llvm "$ROOT"
  llvm-cells: |
    for tool in nx lerna changesets; do
      echo "$tool distributed"
    done
    for mode in compilation interpretation hybrid; do
      echo "dispat $mode"
    done
  llvm-cell: |
    set -eu
    : "${TOOL:?TOOL is required}"
    : "${DISTRIBUTION_MODE:?DISTRIBUTION_MODE is required}"
    case "$TOOL" in dispat|nx|lerna|changesets) ;; *) exit 2 ;; esac
    case "$DISTRIBUTION_MODE" in compilation|interpretation|hybrid|distributed) ;; *) exit 2 ;; esac
    profile=${EXPERIMENTS_LLVM_PROFILE:-full}
    case "$profile" in full|smoke) ;; *) exit 2 ;; esac
    ROOT=$(git rev-parse --show-toplevel)
    RESULTS=${EXPERIMENTS_RESULTS:-$ROOT/coverage/experiments}
    mkdir -p "$RESULTS"
    cell=llvm-$profile-$DISTRIBUTION_MODE-$TOOL
    rm -f "$RESULTS/$cell/verdict.json"
    rc=0
    docker run --rm --cpus "${EXPERIMENTS_LLVM_CPUS:-4}" -v "$RESULTS:/results" \
      -e NX_CLOUD_ACCESS_TOKEN -e EXPERIMENTS_NX_CLOUD_ID -e NX_CLOUD_API -e NX_CLOUD_ENCRYPTION_KEY \
      dispat-experiments-llvm --tool "$TOOL" --mode "$DISTRIBUTION_MODE" --profile "$profile" \
      --jobs "${EXPERIMENTS_LLVM_JOBS:-2}" --timeout "${EXPERIMENTS_LLVM_TIMEOUT:-4h}" \
      > "$RESULTS/$cell.log" 2>&1 || rc=$?
    cat "$RESULTS/$cell.log"
    exit "$rc"
  # Optional one-host diagnostic campaign. Production docs import selected
  # real-VM LLVM and kernel campaigns through import-build-campaigns instead.
  llvm-experiments: |
    set -eu
    dispat exec llvm-build --for pkg:experiments --in pkg:experiments
    dispat exec llvm-cells --for pkg:experiments --in pkg:experiments \
      | xargs -P 1 -L 1 sh -c \
        'TOOL=$0 DISTRIBUTION_MODE=$1 dispat exec llvm-cell --for pkg:experiments --in pkg:experiments'
