# The guide shares dispat's major/minor line and carries its own patches.
versionGroup: cli
tagFormat: specs/agent-guide/v{version}
# The guide's tests perform releases on throwaway repositories, and a worker
# refuses release initiation by design (E226), so every stage of this package
# stays on the machine that holds release authority.
runOnly: orchestrator

scripts:
  verify-guide: sh verify.sh
  tests: sh test.sh

autoVersion:
  manifests: none
  replace:
    - files: [VERSION]
      find: '{previous}'
      write: '{version}'
    - files: [README.md]
      find: '**Version:** {previous}'
      write: '**Version:** {version}'

flow:
  beforeVersion: [verify-guide]
  build: verify-guide
  publish: [changelog, commit]
