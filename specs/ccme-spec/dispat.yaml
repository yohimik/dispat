# CCME is a separate specification package in the parser’s version group.
# Its tag path is stable even if the implementation later moves modules.
tagFormat: specs/ccme-spec/v{version}
versionGroup: ccme

scripts:
  version-spec: sh version.sh
  verify-spec: sh verify.sh
  tests: sh test.sh

# Version substitution and validation happen before any release record is
# written. The shared changelog and commit scripts create the immutable tag;
# the run's final GitHub stage creates the release page after all legs finish.
flow:
  # A standalone specification has no provider manifests to update, so the
  # executor does not create a native version task for it. Run the stamp as a
  # gating build hook instead; beforeBuild always runs immediately before the
  # verifier and carries the planned DISPAT_NEW_VERSION.
  beforeBuild: [version-spec]
  build: verify-spec
  publish: [changelog, commit]
