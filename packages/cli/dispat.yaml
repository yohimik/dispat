tagFormat: packages/cli/v{version}
versionGroup: cli
isBuildWaitingPublish: true
dependencies:
  - provider: dispat
    keep: true
scripts:
  tests: >-
    docker buildx build --file Dockerfile --target typecheck
    $(sh ../../scripts/buildx-cache.sh cli-npm) --output type=cacheonly ../..
  release-metadata: node build/scripts/package-release.js
  # Ordinary CI compiles and exercises fixture packaging inside Docker. It
  # must not require host Node tools or an unpublished provider release.
  build: >-
    docker buildx build --file Dockerfile --target typecheck
    $(sh ../../scripts/buildx-cache.sh cli-npm) --output type=cacheonly ../..
  release-build: |
    set -eu
    # autoVersion rewrites package.json and syncLock rewrites pnpm-lock.yaml
    # after the workflow's explicit --ignore-scripts install. Do not let pnpm
    # implicitly reinstall with lifecycle scripts anywhere in this sequence.
    export pnpm_config_verify_deps_before_run=false
    pnpm build
    node build/scripts/pack.js
    pnpm compile:test
    node test-build/smoke-artifact.js
  publish: node build/scripts/publish.js
  announce: |
    echo "npm-released=true" >> "${GITHUB_OUTPUT:-/dev/null}"
    echo "npm-version=$DISPAT_NEW_VERSION" >> "${GITHUB_OUTPUT:-/dev/null}"
    echo "npm-binary-version=$DISPAT_WORKSPACE_DISPAT_VERSION" >> "${GITHUB_OUTPUT:-/dev/null}"
    echo "published @dispat/bin@$DISPAT_NEW_VERSION"
flow:
  build: release-build
  publish: publish
  announce: announce
github:
  footer:
    - line: ["---", ""]
    - line:
        - "[npm package](https://www.npmjs.com/package/@dispat/bin/v/${DISPAT_NEW_VERSION})"
