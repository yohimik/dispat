# The packages space: the pnpm workspace. This file is the space's own
# configuration; the docs package's exceptions live in packages/docs/dispat.yaml.
autoVersion:
  enabled: true
  syncLock: [pnpm-install]
scripts:
  # Lock reconciliation belongs to the workspace, because both published and
  # private members contribute importer records. The lockfile stage starts
  # before a frozen dependency install so an auto-versioned manifest can be
  # reconciled during release.
  pnpm-install: |
    set -eu
    ROOT=$(git rev-parse --show-toplevel)
    docker buildx build --file "$ROOT/packages/Dockerfile" --target lockfile-export \
      $(sh "$ROOT/scripts/buildx-cache.sh" packages-lockfile) \
      --output "type=local,dest=$ROOT" "$ROOT"
# Every package of this space is gated from its own Dockerfile, so the
# command is the space's rather than any one package's: a second Node
# package brings a Dockerfile and needs no new script and no new CI step.
  # Inherited by the docs package; cli overrides it with its own package gate.
  tests: >-
    docker buildx build --file Dockerfile --target typecheck
    $(sh ../../scripts/buildx-cache.sh docs) --output type=cacheonly ../..
