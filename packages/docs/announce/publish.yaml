# Where dispat's release announcements post, for both channels.
#
# rc/crier.yaml and stable/crier.yaml each pull this file in as their `publish`
# section, so a release candidate and a stable release reach the same
# destinations with the same limits. What a channel writes beside the reference
# is its caption, and what it owns in `render` is its card and its music. A
# destination added here is added to both.
#
# All three are on. A run that must leave one out says so in its environment,
# CRIER_PUBLISH_DISCORD_ENABLED=false for example, which is also how a replay
# reaches the one destination that missed a post. A missing credential fails
# `crier ping`, the release workflow's gate, before any package is published.
instagram:
  enabled: true
  api-base-url: https://graph.instagram.com/v25.0
  poll-timeout: 5m
  # Instagram gets the same pages in the feed and in the stories, and the first
  # of them is the cover as a clip with the channel's music. That takes more
  # than one crier call, so it is the announce stage's work
  # (packages/docs/dispat.yaml): this file is the feed post, and the stage
  # adds the clip in front of it and posts the stories with flags.
  story: false
  cover-story: false
  # Ten items fit in one carousel: the clip and at most nine pages behind it.
  # render.pages-max holds a render to ten pages, the cover included, and the
  # cover is the clip, so crier cannot split an announcement into more posts.
  max-attachments: 10

linkedin:
  enabled: true
  max-attachments: 10

discord:
  enabled: true
  # The captions write @everyone for Discord themselves; this is what lets the
  # webhook act on it. Incoming webhooks take ten ordered files in one
  # multipart message, and crier never retries that request after an ambiguous
  # failure.
  mention-everyone: true
  max-attachments: 10
