# What a stable release says, written by a person: the headline, every link to
# this release, then the notes. stable/crier.yaml pulls this file in as its
# caption, so a release is announced by editing this file and the same words on
# template.html, and never the configuration.
#
# Drafted for 1.11.0 from the candidate's notes in rc/notes.yaml, without what
# only a candidate says. Read it again before the stable release ships.
#
# The only value it takes from the release is {{ .new_version }}. The links come
# first so they survive a platform's caption limit. Discord refuses a message
# over 2000 characters and Instagram a caption over 2200, and crier posts a
# caption whole. Every platform gets the whole text; Discord gets it without
# the hashtags, which mean nothing there and would push it past its limit.
# `crier publish --dry-run --json` prints each platform's caption, which is how
# to check a rewrite against those limits.
--- |-
  {{ if eq .Platform "discord" }}@everyone {{ end }}dispat v{{ .new_version }}: every completed step should count.
  Release: https://github.com/yohimik/dispat/releases/tag/services/dispat/v{{ .new_version }}
  Explore: https://dispat.dev

  A release should not lose its memory when the lights go out. Yet a failure halfway through can leave us searching the wreckage: what shipped, what stopped, and what must never happen twice?

  I built dispat around a conviction: work already done should remain done. A published package is a fact in the world. Recovery begins by remembering it.

  That conviction led me to formulate the dispat theorem. For fixed inputs, dispat compiles one deterministic plan: the tasks, their dependencies, and the actions whose effects cannot simply be undone. The theorem gives a lower bound on execution time and, under its scheduling assumptions, a bound on how closely a greedy executor can approach it. The longest chain of dependencies sets a pace that no number of machines can outrun.

  Across failure, progress needs a durable memory. This is the heart of saga recovery: record completed work, hold back tasks whose prerequisites failed, and rebuild the remaining plan from what actually happened. When a publication outlives its record, verify its identity before adopting it. Then carry the unfinished work forward.

  The idea reaches beyond JavaScript, across languages and ecosystems; beyond a single monorepo, into a fleet of repositories. Its wider promise begins wherever work can be described in advance as tasks, dependencies, and irreversible steps.

  Even outside software, there is something familiar here. We cannot always undo the steps we have taken. We can remember them, understand what they make possible, and choose the next one with care.

  One plan. A memory of progress. A way forward.{{ if ne .Platform "discord" }}

  #dispat #OpenSource #DevTools #ReleaseEngineering #Monorepo #Polyrepo #CICD #DistributedSystems #SagaPattern #Automation{{ end }}
