# What this release candidate says, written by a person: the headline, every
# link to this candidate, then the notes. rc/crier.yaml pulls this file in as
# its caption, so a new candidate is announced by editing this file and the
# same words on template.html, and never the configuration.
#
# The only value it takes from the release is {{ .new_version }}. The links come
# first so they survive a platform's caption limit. Discord refuses a message
# over 2000 characters and Instagram a caption over 2200, and crier posts a
# caption whole. Every platform gets the whole text; Discord gets it without
# the hashtags, which mean nothing there and would push it past its limit.
# `crier publish --dry-run --json` prints each platform's caption, which is how
# to check a rewrite against those limits.
--- |-
  {{ if eq .Platform "discord" }}@everyone {{ end }}dispat v{{ .new_version }} is ready for testing.
  This release candidate: https://github.com/yohimik/dispat/releases/tag/services/dispat/v{{ .new_version }}
  Catch-up experiment: https://dispat.dev/next/internals/experiments/
  Worker nodes guide: https://dispat.dev/next/distributed-execution/
  Report a problem: https://github.com/yohimik/dispat/issues

  Nothing repeated, nothing stranded.

  If a library ships and an app using it fails, the next run finishes what is left, with one command and no manual step. An app with changes of its own ships anyway and picks the library up later, also when it sat out the run where the library shipped.

  Shipping the library alone on the very commit the app was last released at is refused, because two tags on one commit cannot say which came first. Commit first, or ship both together.

  Measured, not claimed. A new release experiment breaks the app's publish after the library shipped and counts what dispat, lerna, nx and changesets each need to catch up. The table is on the site.

  Worker nodes use the repository itself. The orchestrator leaves work on branches of the project's own repository and workers pick it up; another endpoint is one setting away. Publishing and credentials stay on one machine, and a stage that ran on a worker is caught up exactly like one that ran locally.

  Autistic stability for ADHD projects. Mathematical planning. Saga recovery.

  Preview with `dispat status`; it publishes nothing.{{ if ne .Platform "discord" }}

  #golang #opensource #devtools #releaseengineering #cli #monorepo #polyrepo #devops #cicd #automation #distributedbuilds #releasemanagement #buildtools #orchestration #sagapattern #distributedsystems #platformengineering{{ end }}