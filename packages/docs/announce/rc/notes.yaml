# What this release candidate says, written by a person: the headline, every
# link to this candidate, then the notes. rc/crier.yaml pulls this file in as
# its caption, so a new candidate is announced by editing this file and the
# same words on template.html, and never the configuration.
#
# The only value it takes from the release is {{ .new_version }}. The links come
# first so they survive a platform's caption limit. Discord refuses a message
# over 2000 characters and Instagram a caption over 2200, and crier posts a
# caption whole. Every platform gets the whole text; Discord gets it without
# the hashtags, which mean nothing there and would push it past its limit.
# `crier publish --dry-run --json` prints each platform's caption, which is how
# to check a rewrite against those limits.
--- |-
  {{ if eq .Platform "discord" }}@everyone {{ end }}dispat v{{ .new_version }} is ready for testing.
  This release candidate: https://github.com/yohimik/dispat/releases/tag/services/dispat/v{{ .new_version }}
  Worker nodes guide: https://dispat.dev/next/distributed-execution/
  Linked repositories guide: https://dispat.dev/next/choreographed-repositories/
  Report a problem: https://github.com/yohimik/dispat/issues

  Worker nodes. One release, builds on several machines.

  Start a release on one machine and let others do the building. The machine you started on keeps the locks, the plan and the records.

  Everything travels over Git. The orchestrator leaves work in a mailbox repository and workers pick it up, so there are no open ports and nothing to install but dispat.

  What one machine builds, the next one can use, checked before it is used.

  Publishing and credentials stay on one machine. Without a workers section, nothing changes.

  First real workloads: the Linux kernel and LLVM. Two kernel build groups from a public test farm came in under the farm's own times on two cloud machines, and an LLVM release split across two workers finished sooner than on one machine. Run once each, with the same code this candidate ships. More runs to come.

  If a library ships and an app using it fails, nothing is repeated: the next run finishes what is left. An app with changes of its own ships anyway and picks the library up later. One gap in this candidate: that pick-up only happens when the app is part of the run where the library ships. The next candidate closes it.

  Autistic stability for ADHD projects. Mathematical planning. Saga recovery.

  Preview with `dispat status`; it publishes nothing.{{ if ne .Platform "discord" }}

