# The card dispat posts about a release candidate.
#
# The announce stage in packages/docs/dispat.yaml picks this file when the
# dispat version the docs release picks up is on the rc channel;
# stable/crier.yaml is its counterpart for a stable version.
# `ANNOUNCE_NEW_VERSION=1.11.0-rc.4 crier render --config
# packages/docs/announce/rc/crier.yaml` is how the previews beside this file
# were made.
#
# Discord and LinkedIn get the card as it is: a cover, then the notes.
# Instagram gets the same pages in the feed and in the stories, the cover as a
# clip with this channel's music (the announce stage's crier calls). Everything a candidate
# says is written by hand, and not in this file: the caption is notes.yaml and
# the same words are on the card, template.html. Edit those two together
# before a candidate ships.
render:
  # The candidate's face: a faint lattice on near-black, a dependency graph's
  # ruling seen through the panel, with the section labels set as spaced
  # capitals. It reads as the drawing of a release rather than the print of
  # one, which is what a candidate is. The stable card shares every
  # load-bearing rule with it (the page geometry, the margin boxes that carry
  # the version badge and the page counter, the pinned install block)
  # and differs in how it looks. The accents vary with the run's seed, and one
  # run renders once, so every destination receives the same design.
  template: template.html
  # A candidate's announcement is written by a person, in notes.yaml and on the
  # card, so the only thing it takes from the release is dispat's version: the
  # announce stage in packages/docs/dispat.yaml sets ANNOUNCE_NEW_VERSION from
  # the dispat version the docs release picks up, and this prefix turns it into
  # {{ .new_version }} for the card and the caption alike. ANNOUNCE_NOCOVER
  # becomes {{ .nocover }}, which the Instagram passes set to lay the card out
  # without its cover. Nothing generated is posted, on either channel.
  data: "env:ANNOUNCE_"
  width: 1080
  height: 1080
  background: "#101713"
  format: jpeg
  # Instagram will not fetch a PNG, and the card is flat colour, so quality
  # costs little.
  jpeg-quality: 92
  # Only the fonts the two channels share: a release must not render differently
  # because a runner has different fonts installed than a laptop. Poppins and
  # Space Mono live under packages/docs/announce/fonts with their OFL
  # licences, one folder up, which is why the base URL points there.
  hermetic-fonts: true
  base-url: ..
  # The card paginates: page one is the cover and the notes follow it. Notes
  # past ten pages fail the render rather than posting a truncated version of
  # themselves, and ten pictures is also what one post holds.
  pages-max: 10
  video:
    # The pages are stills. The one clip is the cover held under the channel's
    # music, which the announce stage encodes from the rendered cover and
    # posts first on Instagram, in the feed and in the stories.
    enabled: false
    # The candidate's music is the chase: a galop and an accelerando, both
    # still on their way somewhere. The arrival belongs to the stable release.
    audio-pool:
      - anthem-william-tell.mp3
      - anthem-mountain-king.mp3

# The same cross-posting as the stable channel, from the one file both share.
# The caption is the candidate's own and is written beside the reference, which
# replaces that one key and leaves the destinations alone.
publish:
  $ref: ../publish.yaml
  # Human-written, with every link to this candidate, and no generated notes.
  # The words live in notes.yaml so that announcing a new candidate never means
  # editing this file.
  caption:
    $ref: notes.yaml
